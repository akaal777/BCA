<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Learning Hub | Modern Archives</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    :root {
      --primary-dark: #0f0c29;
      --secondary-dark: #302b63;
      --tertiary-dark: #24243e;
      --text-light: #f0f0f0;
      --glow-accent: #6a82fb; /* A vibrant blue for accents */
      --glow-accent-secondary: #fc5c7d; /* A pinkish accent for gradients */
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(45deg, var(--primary-dark), var(--secondary-dark), var(--tertiary-dark));
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: var(--text-light);
      min-height: 100vh;
      overflow-x: hidden;
      padding: 20px;
    }
    
    @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    h1 {
      text-align: center;
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: clamp(2.5em, 8vw, 4em);
      background: linear-gradient(90deg, var(--glow-accent), var(--glow-accent-secondary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      margin: 50px 0 70px;
      letter-spacing: 1px;
      animation: fadeInDown 1.5s ease-out forwards;
      opacity: 0;
    }
    
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section {
      margin: 50px auto;
      padding: 35px;
      background: var(--glass-bg);
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      backdrop-filter: blur(10px);
      animation: fadeInUp 0.8s ease-out forwards;
      opacity: 0;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .section:nth-of-type(1) { animation-delay: 0.4s; }
    .section:nth-of-type(2) { animation-delay: 0.6s; }
    .section:nth-of-type(3) { animation-delay: 0.8s; }

    .section:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .section h2 {
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      color: var(--text-light);
      font-size: 2.2rem;
      margin: 0 0 35px 0;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--glow-accent);
      display: flex;
      align-items: center;
      gap: 15px;
    }
    
    .section h2 i {
        color: var(--glow-accent);
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }

    .buttons button {
      padding: 15px 20px;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.15);
      color: var(--text-light);
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      position: relative;
      overflow: hidden;
    }

    .buttons button i {
      font-size: 1.3rem;
      color: var(--text-light);
      width: 25px;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .buttons button:hover, .buttons button:focus {
      background-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 15px var(--glow-accent);
      border-color: var(--glow-accent);
      transform: translateY(-5px);
      outline: none;
    }
    
    .buttons button:hover i {
      transform: scale(1.1);
    }
    
    .buttons button::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        transition: left 0.5s ease;
    }

    .buttons button:hover::before {
        left: 100%;
    }

    /* Responsive Adjustments */
    @media (max-width: 768px) {
      h1 { font-size: 2.8rem; margin: 40px 0 50px; }
      .section { margin: 40px 15px; padding: 25px; }
      .section h2 { font-size: 2rem; }
      .buttons button { font-size: 0.95rem; padding: 12px 18px; }
    }

    @media (max-width: 480px) {
      body { padding: 10px; }
      h1 { font-size: 2.2rem; }
      .section { margin: 30px 10px; padding: 20px; }
      .section h2 { font-size: 1.6rem; }
      .buttons { grid-template-columns: 1fr; gap: 15px; }
    }

  </style>
</head>
<body>

  <div class="container">
    <h1>Math Archives</h1>

    <div class="section">
      <h2><i class="fas fa-book-open"></i> Local Files (Offline PDFs)</h2>
      <div class="buttons" id="offline-pdf-buttons"></div>
    </div>

    <div class="section">
      <h2><i class="fas fa-cloud"></i> Online Resources (Cloud PDFs)</h2>
      <div class="buttons" id="online-pdf-buttons"></div>
    </div>

    <div class="section">
      <h2><i class="fab fa-youtube"></i> Video Lectures (YouTube)</h2>
      <div class="buttons" id="youtube-buttons"></div>
    </div>
  </div>

  <script>
    // Data for buttons remains unchanged as it is well-structured and functional.
    const offlinePdfs = [
      { name: "Ch 2: Transcendental Equations", path: "ch2.pdf" }, { name: "Ch 4: Interpolation", path: "ch4.pdf" },
      { name: "Ch 7: Central Tendency", path: "ch7.pdf" }, { name: "Ch 8: Measures Of Dispersion", path: "ch8.pdf" },
      { name: "Ch 9: Correlation Analysis", path: "ch9.pdf" }, { name: "Ch 10: Regression Analysis", path: "ch10.pdf" },
      { name: "Math Program Scrolls", path: "math program.pdf" }, { name: "Math Program (w/ Output)", path: "MathProgram.pdf" }
    ];

    const onlinePdfs = [
      { name: "Ch 1: Basic Number System", url: "https://drive.google.com/file/d/1g976Xekx2uq0qlcr2qLU0HFBqMO3ZKXA/view?usp=drive_link" },
      { name: "Ch 5: Curve Fitting", url: "https://drive.google.com/file/d/1lGh5-9WRq6OF726_tGgAaHjQlauFhEoZ/view?usp=drive_link" },
      { name: "Ch 3: Algebraic Equations", url: "https://drive.google.com/file/d/18Ba3mJNd6HvXIbyNsJbwx_MFE-CKppde/view?usp=drive_link" },
      { name: "Ch 2: Transcendental Equations", url: "https://drive.google.com/file/d/1oTTunyj1tR1rSEqxcYMJ4f6bWSMVDyBF/view?usp=drive_link" },
      { name: "Ch 4: Interpolation", url: "https://drive.google.com/file/d/1NnR1-6CYWQUQw1mNBTdxjrSGjQuoPPtL/view?usp=drive_link" },
      { name: "Ch 7: Central Tendency", url: "https://drive.google.com/file/d/1NE9r302BbLJSV2cQlaPVhSgK82Ln6aGr/view?usp=drive_link" },
      { name: "Ch 8: Measures of Dispersion", url: "https://drive.google.com/file/d/1e9TTvkTIJVjGAOwVJ-2J-mwbjeLjNyLW/view?usp=drive_link" },
      { name: "Ch 9: Correlation Analysis", url: "https://drive.google.com/file/d/1m9Tu6DNHc-PywWtgLzRJd_d-6aksd_x3/view?usp=drive_link" },
      { name: "Ch 10: Regression Analysis", url: "https://drive.google.com/file/d/10L_0FuJWHhEjN4BdWXkJyNo0vay83qiU/view?usp=drive_link" },
      { name: "Math Program Scrolls", url: "https://drive.google.com/file/d/1amkqkL2TbU7EqMM2txFW04Dzzp_YR1Ve/view?usp=drive_link" },
      { name: "Math Program (w/ Output)", url: "https://drive.google.com/file/d/1tf18mmJ935bqtq1hGBa5S9XQmybq77gl/view?usp=drive_link" }
    ];

    const youtubeLinks = [
      { name: "Correlation Analysis", url: "https://youtu.be/-hHEUp57DBE?si=ah_RCCT-E93mMkeU" },
      { name: "Regression Analysis", url: "https://youtu.be/SJyhSU8PsTk?si=6N849Hu_fLc6Gpe5" },
      { name: "Measures of Dispersion", url: "https://youtu.be/5sakfGibqVw?si=OanrbnBzENwGp_FJ" },
      { name: "Central Tendency [PL]", url: "https://youtube.com/playlist?list=PLEHGYFbPuuMEhz_AU8iCrBTYb5eNtFpeg&si=OX14BamdC-zGBrVG" },
      { name: "Transcendental Equations [PL]", url: "https://youtube.com/playlist?list=PLEHGYFbPuuMGfyIXGx8V-Xhi0HRSjT8Ak&si=lUsZgqqQxLN6ZQfc" },
      { name: "Lagrange Interpolation", url: "https://youtu.be/zdyUwzOm1zw?si=EVs-_PyFWziBY-98" },
      { name: "Newton's Divided Difference", url: "https://youtu.be/OVfTwFbevwE?si=kR-PimRIk6OVXhiA" },
      { name: "Mean, Median, Mode", url: "https://youtu.be/MyPx7y2LQKA?si=q3oAhKP7KSAljX1C" },
      { name: "All In One [PL]", url: "https://youtube.com/playlist?list=PLEHGYFbPuuMG6pzcxcjbMJ6ORODnEC8T9&feature=shared"},
    ];

    function createButtons(data, containerId, defaultIconClass, isOffline = false) {
      const container = document.getElementById(containerId);
      data.forEach(item => {
        const button = document.createElement("button");
        const icon = document.createElement("i");
        defaultIconClass.split(' ').forEach(cls => icon.classList.add(cls));
        const buttonText = document.createTextNode(` ${item.name}`);
        button.appendChild(icon);
        button.appendChild(buttonText);
        button.onclick = () => window.open(isOffline ? item.path : item.url, "_blank");
        container.appendChild(button);
      });
    }

    createButtons(offlinePdfs, "offline-pdf-buttons", "fas fa-book-open", true);
    createButtons(onlinePdfs, "online-pdf-buttons", "fas fa-cloud");
    createButtons(youtubeLinks, "youtube-buttons", "fab fa-youtube");

  </script>
</body>
</html>
