<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Wano Archives | Math Scrolls</title>
  <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    :root {
      --wano-night: #1a182f; /* Deep indigo for night sky */
      --wano-paper: #f3e9d2; /* Washi paper texture */
      --wano-wood: #4a2c2a; /* Dark wood for frames */
      --wano-text: #3a2d2d; /* Dark, earthy text color */
      --wano-red: #ac1e23; /* Accent red for seals/titles */
      --cherry-blossom: #ffb7c5; /* Sakura pink */
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: var(--wano-night);
      background-image: linear-gradient(to top, #1a182f, #312244);
      background-attachment: fixed;
      color: var(--wano-text);
      min-height: 100vh;
      overflow-x: hidden;
      padding: 20px;
      position: relative;
    }

    /* Animated Sakura Petals Background */
    .sakura-container {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0; pointer-events: none;
    }

    .sakura {
      position: absolute;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path fill="%23ffb7c5" d="M50 0 C 80 10, 90 40, 50 50 C 10 40, 20 10, 50 0 Z" transform="rotate(45 50 50)"/></svg>');
      background-size: contain;
      background-repeat: no-repeat;
      width: 25px; height: 25px;
      opacity: 0;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.9; }
      90% { opacity: 0.9; }
      100% { transform: translateY(110vh) translateX(15vw) rotate(720deg); opacity: 0; }
    }
    .sakura:nth-child(1) { left: 5%; animation-duration: 15s; animation-delay: -2s; }
    .sakura:nth-child(2) { left: 15%; animation-duration: 12s; animation-delay: -8s; animation-name: fall2; }
    .sakura:nth-child(3) { left: 25%; animation-duration: 18s; animation-delay: -5s; }
    .sakura:nth-child(4) { left: 35%; animation-duration: 20s; animation-delay: -1s; animation-name: fall2; }
    .sakura:nth-child(5) { left: 45%; animation-duration: 14s; animation-delay: -12s; }
    .sakura:nth-child(6) { left: 55%; animation-duration: 16s; animation-delay: -4s; animation-name: fall2; }
    .sakura:nth-child(7) { left: 65%; animation-duration: 11s; animation-delay: -9s; }
    .sakura:nth-child(8) { left: 75%; animation-duration: 22s; animation-delay: -3s; animation-name: fall2; }
    .sakura:nth-child(9) { left: 85%; animation-duration: 13s; animation-delay: -6s; }
    .sakura:nth-child(10) { left: 95%; animation-duration: 17s; animation-delay: 0s; animation-name: fall2; }

    @keyframes fall2 {
        0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
        10% { opacity: 0.9; }
        90% { opacity: 0.9; }
        100% { transform: translateY(110vh) translateX(-15vw) rotate(720deg); opacity: 0; }
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    h1 {
      text-align: center;
      font-family: 'Yuji Syuku', serif;
      font-size: 3.8rem;
      color: var(--wano-paper);
      margin: 50px 0 70px;
      letter-spacing: 2px;
      animation: fadeInDown 1.5s ease-out forwards;
      opacity: 0;
      text-shadow: 2px 2px 5px var(--wano-night), 0 0 10px var(--cherry-blossom);
    }
    
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section {
      margin: 60px auto;
      padding: 35px;
      background: var(--wano-paper);
      border-radius: 10px;
      border: 4px solid var(--wano-wood);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      animation: fadeInUp 0.8s ease-out forwards;
      opacity: 0;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .section:nth-of-type(1) { animation-delay: 0.4s; }
    .section:nth-of-type(2) { animation-delay: 0.6s; }
    .section:nth-of-type(3) { animation-delay: 0.8s; }

    .section:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .section h2 {
      font-family: 'Yuji Syuku', serif;
      text-align: center;
      color: var(--wano-red);
      font-size: 2.5rem;
      margin: 0 0 35px 0;
      font-weight: 700;
      letter-spacing: 1px;
      border-bottom: 2px solid #d3c8aa;
      padding-bottom: 15px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }

    .buttons button {
      padding: 15px 20px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      border: 2px solid var(--wano-wood);
      border-radius: 8px;
      background: #d3c8aa; /* Darker paper tone */
      color: var(--wano-text);
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      text-align: left;
    }

    .buttons button i {
      font-size: 1.4rem;
      color: var(--wano-wood);
      width: 25px;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .buttons button:hover {
      background: var(--wano-wood);
      color: var(--wano-paper);
      border-color: var(--wano-text);
      transform: translateY(-5px);
      box-shadow: 0 8px 15px rgba(0,0,0,0.3);
    }
    .buttons button:hover i {
      color: var(--wano-paper);
      transform: scale(1.1);
    }

    /* Responsive Adjustments */
    @media (max-width: 768px) {
      h1 { font-size: 2.8rem; margin: 40px 0 50px; }
      .section { margin: 40px 15px; padding: 25px; }
      .section h2 { font-size: 2rem; }
      .buttons button { font-size: 1rem; padding: 12px 18px; }
    }

    @media (max-width: 480px) {
      body { padding: 10px; }
      h1 { font-size: 2.2rem; }
      .section { margin: 30px 10px; padding: 20px; border-width: 3px; }
      .section h2 { font-size: 1.8rem; }
      .buttons { grid-template-columns: 1fr; gap: 15px; }
    }

  </style>
</head>
<body>

  <div class="sakura-container">
    <div class="sakura"></div> <div class="sakura"></div>
    <div class="sakura"></div> <div class="sakura"></div>
    <div class="sakura"></div> <div class="sakura"></div>
    <div class="sakura"></div> <div class="sakura"></div>
    <div class="sakura"></div> <div class="sakura"></div>
  </div>

  <div class="container">
    <h1>Wano Math Archives</h1>

    <div class="section">
      <h2><i class="fas fa-scroll"></i> Kuri Scrolls (Offline PDFs)</h2>
      <div class="buttons" id="offline-pdf-buttons"></div>
    </div>

    <div class="section">
      <h2><i class="fas fa-torii-gate"></i> Ringo Texts (Online PDFs)</h2>
      <div class="buttons" id="online-pdf-buttons"></div>
    </div>

    <div class="section">
      <h2><i class="fas fa-video"></i> Flower Capital Katas (YouTube)</h2>
      <div class="buttons" id="youtube-buttons"></div>
    </div>
  </div>

  <script>
    const offlinePdfs = [
      { name: "Ch 2: Transcendental Equations", path: "ch2.pdf" },
      { name: "Ch 4: Interpolation", path: "ch4.pdf" },
      { name: "Ch 7: Central Tendency", path: "ch7.pdf" },
      { name: "Ch 8: Measures Of Dispersion", path: "ch8.pdf" },
      { name: "Ch 9: Correlation Analysis", path: "ch9.pdf" },
      { name: "Ch 10: Regression Analysis", path: "ch10.pdf" },
      { name: "Math Program Scrolls", path: "math program.pdf" },
      { name: "Math Program (w/ Output)", path: "MathProgram.pdf" }
    ];

    const onlinePdfs = [
      { name: "Ch 1: Basic Number System", url: "https://drive.google.com/file/d/1g976Xekx2uq0qlcr2qLU0HFBqMO3ZKXA/view?usp=drive_link" },
      { name: "Ch 5: Curve Fitting", url: "https://drive.google.com/file/d/1lGh5-9WRq6OF726_tGgAaHjQlauFhEoZ/view?usp=drive_link" },
      { name: "Ch 3: Algebraic Equations", url: "https://drive.google.com/file/d/18Ba3mJNd6HvXIbyNsJbwx_MFE-CKppde/view?usp=drive_link" },
      { name: "Ch 2: Transcendental Equations", url: "https://drive.google.com/file/d/1oTTunyj1tR1rSEqxcYMJ4f6bWSMVDyBF/view?usp=drive_link" },
      { name: "Ch 4: Interpolation", url: "https://drive.google.com/file/d/1NnR1-6CYWQUQw1mNBTdxjrSGjQuoPPtL/view?usp=drive_link" },
      { name: "Ch 7: Central Tendency", url: "https://drive.google.com/file/d/1NE9r302BbLJSV2cQlaPVhSgK82Ln6aGr/view?usp=drive_link" },
      { name: "Ch 8: Measures of Dispersion", url: "https://drive.google.com/file/d/1e9TTvkTIJVjGAOwVJ-2J-mwbjeLjNyLW/view?usp=drive_link" },
      { name: "Ch 9: Correlation Analysis", url: "https://drive.google.com/file/d/1m9Tu6DNHc-PywWtgLzRJd_d-6aksd_x3/view?usp=drive_link" },
      { name: "Ch 10: Regression Analysis", url: "https://drive.google.com/file/d/10L_0FuJWHhEjN4BdWXkJyNo0vay83qiU/view?usp=drive_link" },
      { name: "Math Program Scrolls", url: "https://drive.google.com/file/d/1amkqkL2TbU7EqMM2txFW04Dzzp_YR1Ve/view?usp=drive_link" },
      { name: "Math Program (w/ Output)", url: "https://drive.google.com/file/d/1tf18mmJ935bqtq1hGBa5S9XQmybq77gl/view?usp=drive_link" }
    ];

    const youtubeLinks = [
      { name: "Correlation Analysis", url: "https://youtu.be/-hHEUp57DBE?si=ah_RCCT-E93mMkeU" },
      { name: "Regression Analysis", url: "https://youtu.be/SJyhSU8PsTk?si=6N849Hu_fLc6Gpe5" },
      { name: "Measures of Dispersion", url: "https://youtu.be/5sakfGibqVw?si=OanrbnBzENwGp_FJ" },
      { name: "Central Tendency [PL]", url: "https://youtube.com/playlist?list=PLEHGYFbPuuMEhz_AU8iCrBTYb5eNtFpeg&si=OX14BamdC-zGBrVG" },
      { name: "Transcendental Equations [PL]", url: "https://youtube.com/playlist?list=PLEHGYFbPuuMGfyIXGx8V-Xhi0HRSjT8Ak&si=lUsZgqqQxLN6ZQfc" },
      { name: "Lagrange Interpolation", url: "https://youtu.be/zdyUwzOm1zw?si=EVs-_PyFWziBY-98" },
      { name: "Newton's Divided Difference", url: "https://youtu.be/OVfTwFbevwE?si=kR-PimRIk6OVXhiA" },
      { name: "Mean, Median, Mode", url: "https://youtu.be/MyPx7y2LQKA?si=q3oAhKP7KSAljX1C" },
      { name: "All In One [PL]", url: "https://youtube.com/playlist?list=PLEHGYFbPuuMG6pzcxcjbMJ6ORODnEC8T9&feature=shared"},
    ];

    function createButtons(data, containerId, defaultIconClass, isOffline = false) {
      const container = document.getElementById(containerId);
      data.forEach(item => {
        const button = document.createElement("button");
        const icon = document.createElement("i");
        defaultIconClass.split(' ').forEach(cls => icon.classList.add(cls));
        const buttonText = document.createTextNode(` ${item.name}`);
        button.appendChild(icon);
        button.appendChild(buttonText);
        button.onclick = () => window.open(isOffline ? item.path : item.url, "_blank");
        container.appendChild(button);
      });
    }

    createButtons(offlinePdfs, "offline-pdf-buttons", "fas fa-book-open", true);
    createButtons(onlinePdfs, "online-pdf-buttons", "fas fa-cloud");
    createButtons(youtubeLinks, "youtube-buttons", "fab fa-youtube");

  </script>
</body>
</html>
