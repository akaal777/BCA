<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Archives | Sophisticated Learning Hub</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-color: #0a0a0c;
      --card-bg: rgba(22, 22, 26, 0.7);
      --accent-gold: #c5a47e;
      --accent-gold-low: rgba(197, 164, 126, 0.1);
      --text-main: #e2e2e7;
      --text-dim: #94949e;
      --border-color: rgba(255, 255, 255, 0.08);
      --glass-glow: rgba(197, 164, 126, 0.05);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
      /* Subtle texture overlay */
      background-image: radial-gradient(circle at 50% -20%, #1a1a20 0%, transparent 60%);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 80px 20px;
    }

    /* --- Sophisticated Header --- */
    .header-area {
      text-align: center;
      margin-bottom: 100px;
      opacity: 0;
      transform: translateY(30px);
      transition: all 1s ease;
    }

    .header-area.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .header-area span {
      text-transform: uppercase;
      letter-spacing: 5px;
      font-size: 0.8rem;
      color: var(--accent-gold);
      display: block;
      margin-bottom: 15px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 20px;
      background: linear-gradient(to bottom, #fff, #a1a1a1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* --- Section Styling --- */
    .section {
      margin-bottom: 80px;
      opacity: 0;
      transform: translateY(40px);
      transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 40px;
    }

    .section-title h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .section-title .line {
      height: 1px;
      background: linear-gradient(90deg, var(--accent-gold), transparent);
      flex-grow: 1;
    }

    /* --- Modern Bento Cards --- */
    .resource-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }

    .resource-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
      backdrop-filter: blur(12px);
      position: relative;
      overflow: hidden;
      min-height: 140px;
    }

    .resource-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at top left, var(--glass-glow), transparent);
      opacity: 0;
      transition: opacity 0.4s;
    }

    .resource-card:hover {
      transform: translateY(-8px);
      border-color: var(--accent-gold);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .resource-card:hover::before {
      opacity: 1;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 15px;
      position: relative;
      z-index: 1;
    }

    .card-icon {
      width: 45px;
      height: 45px;
      background: var(--accent-gold-low);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-gold);
      font-size: 1.2rem;
    }

    .card-type {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-dim);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 20px;
    }

    .card-info h3 {
      font-size: 1.05rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      color: var(--text-main);
      position: relative;
      z-index: 1;
    }

    .view-action {
      margin-top: 20px;
      font-size: 0.8rem;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transform: translateX(-10px);
      transition: all 0.3s ease;
    }

    .resource-card:hover .view-action {
      opacity: 1;
      transform: translateX(0);
    }

    /* --- Custom Scrollbar --- */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-color); }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-gold); }

    /* --- Responsive --- */
    @media (max-width: 768px) {
      .container { padding: 40px 15px; }
      h1 { font-size: 2.8rem; }
      .header-area { margin-bottom: 60px; }
      .resource-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="header-area" id="mainHeader">
      <span>Curated Academic Repository</span>
      <h1>Mathematics <br><i>Archives</i></h1>
    </header>

    <div class="section" id="sec-offline">
      <div class="section-title">
        <i class="fas fa-book-open" style="color: var(--accent-gold)"></i>
        <h2>Local Documents</h2>
        <div class="line"></div>
      </div>
      <div class="resource-grid" id="offline-grid"></div>
    </div>

    <div class="section" id="sec-online">
      <div class="section-title">
        <i class="fas fa-cloud" style="color: var(--accent-gold)"></i>
        <h2>Cloud Repository</h2>
        <div class="line"></div>
      </div>
      <div class="resource-grid" id="online-grid"></div>
    </div>

    <div class="section" id="sec-video">
      <div class="section-title">
        <i class="fab fa-youtube" style="color: var(--accent-gold)"></i>
        <h2>Visual Lectures</h2>
        <div class="line"></div>
      </div>
      <div class="resource-grid" id="youtube-grid"></div>
    </div>
  </div>

  <script>
    const data = {
      offline: [
          { name: "Ch 2: Transcendental Equations", path: "ch2.pdf" }, { name: "Ch 4: Interpolation", path: "ch4.pdf" },
      { name: "Ch 7: Central Tendency", path: "ch7.pdf" }, { name: "Ch 8: Measures Of Dispersion", path: "ch8.pdf" },
      { name: "Ch 9: Correlation Analysis", path: "ch9.pdf" }, { name: "Ch 10: Regression Analysis", path: "ch10.pdf" },
      { name: "Math Program Scrolls", path: "math program.pdf" }, { name: "Math Program (w/ Output)", path: "MathProgram.pdf" }
      ],
      online: [
       { name: "Ch 1: Basic Number System", url: "https://drive.google.com/file/d/1g976Xekx2uq0qlcr2qLU0HFBqMO3ZKXA/view?usp=drive_link" },
      { name: "Ch 5: Curve Fitting", url: "https://drive.google.com/file/d/1lGh5-9WRq6OF726_tGgAaHjQlauFhEoZ/view?usp=drive_link" },
      { name: "Ch 3: Algebraic Equations", url: "https://drive.google.com/file/d/18Ba3mJNd6HvXIbyNsJbwx_MFE-CKppde/view?usp=drive_link" },
      { name: "Ch 2: Transcendental Equations", url: "https://drive.google.com/file/d/1oTTunyj1tR1rSEqxcYMJ4f6bWSMVDyBF/view?usp=drive_link" },
      { name: "Ch 4: Interpolation", url: "https://drive.google.com/file/d/1NnR1-6CYWQUQw1mNBTdxjrSGjQuoPPtL/view?usp=drive_link" },
      { name: "Ch 7: Central Tendency", url: "https://drive.google.com/file/d/1NE9r302BbLJSV2cQlaPVhSgK82Ln6aGr/view?usp=drive_link" },
      { name: "Ch 8: Measures of Dispersion", url: "https://drive.google.com/file/d/1e9TTvkTIJVjGAOwVJ-2J-mwbjeLjNyLW/view?usp=drive_link" },
      { name: "Ch 9: Correlation Analysis", url: "https://drive.google.com/file/d/1m9Tu6DNHc-PywWtgLzRJd_d-6aksd_x3/view?usp=drive_link" },
      { name: "Ch 10: Regression Analysis", url: "https://drive.google.com/file/d/10L_0FuJWHhEjN4BdWXkJyNo0vay83qiU/view?usp=drive_link" },
      { name: "Math Program Scrolls", url: "https://drive.google.com/file/d/1amkqkL2TbU7EqMM2txFW04Dzzp_YR1Ve/view?usp=drive_link" },
      { name: "Math Program (w/ Output)", url: "https://drive.google.com/file/d/1tf18mmJ935bqtq1hGBa5S9XQmybq77gl/view?usp=drive_link" }
      ],
      youtube: [
        { name: "Correlation Analysis", url: "https://youtu.be/-hHEUp57DBE?si=ah_RCCT-E93mMkeU" },
      { name: "Regression Analysis", url: "https://youtu.be/SJyhSU8PsTk?si=6N849Hu_fLc6Gpe5" },
      { name: "Measures of Dispersion", url: "https://youtu.be/5sakfGibqVw?si=OanrbnBzENwGp_FJ" },
      { name: "Central Tendency [PL]", url: "https://youtube.com/playlist?list=PLEHGYFbPuuMEhz_AU8iCrBTYb5eNtFpeg&si=OX14BamdC-zGBrVG" },
      { name: "Transcendental Equations [PL]", url: "https://youtube.com/playlist?list=PLEHGYFbPuuMGfyIXGx8V-Xhi0HRSjT8Ak&si=lUsZgqqQxLN6ZQfc" },
      { name: "Lagrange Interpolation", url: "https://youtu.be/zdyUwzOm1zw?si=EVs-_PyFWziBY-98" },
      { name: "Newton's Divided Difference", url: "https://youtu.be/OVfTwFbevwE?si=kR-PimRIk6OVXhiA" },
      { name: "Mean, Median, Mode", url: "https://youtu.be/MyPx7y2LQKA?si=q3oAhKP7KSAljX1C" },
      { name: "All In One [PL]", url: "https://youtube.com/playlist?list=PLEHGYFbPuuMG6pzcxcjbMJ6ORODnEC8T9&feature=shared"},
      ]
    };

    function renderCards() {
      const render = (items, containerId, icon, isVideo = false) => {
        const container = document.getElementById(containerId);
        items.forEach(item => {
          const card = document.createElement("div");
          card.className = "resource-card";
          card.innerHTML = `
            <div class="card-top">
              <div class="card-icon"><i class="${icon}"></i></div>
              <div class="card-type">${item.type || item.meta || 'PDF'}</div>
            </div>
            <div class="card-info">
              <h3>${item.name}</h3>
              <div class="view-action">
                <span>Access Resource</span>
                <i class="fas fa-arrow-right"></i>
              </div>
            </div>
          `;
          card.onclick = () => window.open(item.path || item.url, "_blank");
          container.appendChild(card);
        });
      };

      render(data.offline, "offline-grid", "fas fa-file-pdf");
      render(data.online, "online-grid", "fas fa-globe");
      render(data.youtube, "youtube-grid", "fab fa-youtube", true);
    }

    // Animation on Scroll Logic
    function initAnimations() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
          }
        });
      }, { threshold: 0.1 });

      document.querySelectorAll('.section, .header-area').forEach(el => observer.observe(el));
    }

    window.onload = () => {
      renderCards();
      initAnimations();
    };
  </script>
</body>
</html>
