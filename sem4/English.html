<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All My Sons | Arthur Miller - Literary Archive</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0f172a; /* Midnight Blue */
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-gold: #e2b87e;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(226, 184, 126, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(51, 65, 85, 0.3) 0px, transparent 50%);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        /* --- Elegant Header --- */
        .header {
            text-align: center;
            margin-bottom: 80px;
            opacity: 0;
            transform: translateY(-20px);
            animation: fadeInDown 1s ease forwards;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 10px;
        }

        .header p {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.2rem;
            color: var(--accent-gold);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- Aesthetic Sections --- */
        .section {
            margin-bottom: 60px;
            opacity: 0; /* Hidden by default for scroll animation */
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .section-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            white-space: nowrap;
        }

        .section-header .line {
            height: 1px;
            background: linear-gradient(90deg, var(--accent-gold), transparent);
            flex-grow: 1;
        }

        /* --- Modern Grid & Buttons --- */
        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .modern-btn {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            padding: 20px 25px;
            border-radius: 12px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            text-align: left;
        }

        .modern-btn i {
            color: var(--accent-gold);
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }

        .modern-btn span {
            font-weight: 500;
            font-size: 1.05rem;
            letter-spacing: 0.5px;
        }

        .modern-btn:hover {
            border-color: var(--accent-gold);
            background: rgba(226, 184, 126, 0.1);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .modern-btn:hover i {
            transform: translateX(5px);
        }

        /* --- Footer --- */
        .footer-card {
            background: linear-gradient(135deg, rgba(226, 184, 126, 0.1), transparent);
            border: 1px solid var(--accent-gold);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            margin-top: 40px;
        }

        .footer-card p {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-style: italic;
        }

        /* --- Animations --- */
        @keyframes fadeInDown {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container { padding: 40px 15px; }
            .header h1 { font-size: 2.5rem; }
            .button-grid { grid-template-columns: 1fr; }
            .modern-btn { padding: 18px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <h1>All My Sons</h1>
            <p>A Tragedy by Arthur Miller</p>
        </header>

        <section class="section">
            <div class="section-header">
                <h2>The Archive</h2>
                <div class="line"></div>
            </div>
            <div class="button-grid">
                <button class="modern-btn" id="storyBtn">
                    <span>The Full Narrative</span>
                    <i class="fa-solid fa-file-pdf"></i>
                </button>
                <button class="modern-btn" id="scriptBtn">
                    <span>Performance Script</span>
                    <i class="fa-solid fa-scroll"></i>
                </button>
                <button class="modern-btn" id="summaryBtn">
                    <span>Executive Summary</span>
                    <i class="fa-solid fa-clipboard-list"></i>
                </button>
            </div>
        </section>

        <section class="section">
            <div class="section-header">
                <h2>Persona Analysis</h2>
                <div class="line"></div>
            </div>
            <div class="button-grid">
                <button class="modern-btn" id="character1Btn"><span>Joe Keller</span><i class="fa-solid fa-user"></i></button>
                <button class="modern-btn" id="character2Btn"><span>Kate Keller</span><i class="fa-solid fa-user"></i></button>
                <button class="modern-btn" id="character3Btn"><span>Chris Keller</span><i class="fa-solid fa-user"></i></button>
                <button class="modern-btn" id="character4Btn"><span>Ann Deever</span><i class="fa-solid fa-user"></i></button>
                <button class="modern-btn" id="character5Btn"><span>George Deever</span><i class="fa-solid fa-user"></i></button>
            </div>
        </section>

        <section class="section">
            <div class="section-header">
                <h2>Visual Lectures</h2>
                <div class="line"></div>
            </div>
            <div class="button-grid">
                <button class="modern-btn" id="video1Btn"><span>Hindi Summary</span><i class="fa-solid fa-play"></i></button>
                <button class="modern-btn" id="video2Btn"><span>Punjabi Summary</span><i class="fa-solid fa-play"></i></button>
                <button class="modern-btn" id="video3Btn"><span>Full Play Analysis</span><i class="fa-solid fa-clapperboard"></i></button>
            </div>
        </section>

        <footer class="section footer-card">
            <p>Elevate your literary understanding as we transition into Semester 3.</p>
        </footer>
    </div>

    <script>
        // Data and Event Listeners (Logic kept intact)
        const pdfPaths = {
            story: "englishstory.pdf",
            script: "englishscript.pdf",
            summary: "Englishsummary.pdf"
        };

        const characterLinks = {
            char1: "https://youtu.be/APk_bXUSdC0?si=aeWV4490hIX7_HAw",
            char2: "https://youtu.be/8tFDfb3I3A4?si=9PVqH3HEWNPtbcfd",
            char3: "https://youtu.be/Sop5gaCxWs4?si=bwFUM3h-gqba7nbm",
            char4: "https://youtu.be/TEFRgmRo4pc?si=P093zbGnjaQaUe2t",
            char5: "https://youtu.be/Pqk3_J_JPHJQ?si=sERgg4YH38E5WsuC"
        };

        const openLink = (url) => window.open(url, '_blank');

        // Mapping listeners
        const bind = (id, url) => document.getElementById(id).addEventListener('click', () => openLink(url));

        bind('storyBtn', pdfPaths.story);
        bind('scriptBtn', pdfPaths.script);
        bind('summaryBtn', pdfPaths.summary);
        
        bind('character1Btn', characterLinks.char1);
        bind('character2Btn', characterLinks.char2);
        bind('character3Btn', characterLinks.char3);
        bind('character4Btn', characterLinks.char4);
        bind('character5Btn', characterLinks.char5);

        bind('video1Btn', 'https://youtu.be/m0Pbjodj6mk?si=HNivmcJa3VLAWX0-');
        bind('video2Btn', 'https://youtu.be/B5pF4ffW2DI?si=xvWYdIKDSkTxnh9p');
        bind('video3Btn', 'https://youtu.be/Sh1IhIfTHFk?si=Nanrl8pby8Npef-l');

        // --- Smooth Intersection Observer for Scroll Animations ---
        const observerOptions = { threshold: 0.1 };
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);

        document.querySelectorAll('.section').forEach(section => observer.observe(section));
    </script>
</body>
</html>
