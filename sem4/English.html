<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All My Sons - Arthur Miller | Grand Line Archives</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --parchment-bg: #f5e8c8; /* Aged paper background */
            --wood-plank: #8B4513; /* SaddleBrown for buttons */
            --wood-dark: #5a2d0c; /* Darker wood for borders/shadows */
            --text-dark: #3b2f2f; /* Dark brown for text */
            --pirate-red: #c0392b; /* A deep red accent */
            --pirate-gold: #f1c40f; /* Accent gold */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><g fill="%23d2b48c" fill-opacity="0.1"><rect x="50" width="50" height="50"/><rect y="50" width="50" height="50"/></g></svg>'), linear-gradient(to bottom, #e6b88a, #d2a67d);
            background-color: #d2b48c; /* Tan color similar to a map */
            color: var(--text-dark);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .heading {
            text-align: center;
            margin: 40px 0 60px;
            font-family: 'Bangers', cursive;
            font-size: clamp(3em, 8vw, 6em);
            color: var(--text-dark);
            text-shadow: 3px 3px 0px rgba(245, 232, 200, 0.7);
            letter-spacing: 3px;
            animation: stampIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            line-height: 1.1;
        }

        .heading span {
            font-size: 0.4em;
            font-weight: 400;
            color: var(--text-dark);
            text-shadow: 1px 1px 0px rgba(245, 232, 200, 0.7);
            display: block;
            margin-top: 5px;
            letter-spacing: 2px;
        }

        @keyframes stampIn {
            from {
                opacity: 0;
                transform: scale(1.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .section {
            background: var(--parchment-bg);
            padding: 30px;
            border-radius: 5px;
            margin-bottom: 40px;
            border: 2px solid #c8b796;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2), inset 0 0 25px rgba(0,0,0,0.1);
            opacity: 0;
            transform: translateY(30px);
            /* JS will handle the animation */
        }

        .section-title {
            margin-bottom: 25px;
            color: var(--pirate-red);
            font-family: 'Bangers', cursive;
            font-size: clamp(1.8em, 4vw, 2.5em);
            text-shadow: 1px 1px 0 var(--parchment-bg);
            position: relative;
            padding-bottom: 10px;
            letter-spacing: 1.5px;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60px;
            height: 4px;
            background: var(--pirate-red);
            border-radius: 2px;
        }

        .button-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .btn {
            padding: 15px 25px;
            border: 2px solid var(--wood-dark);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease-out;
            background: var(--wood-plank);
            color: #fff;
            font-family: 'Bangers', cursive;
            font-weight: 400;
            font-size: 1.2em;
            letter-spacing: 1.5px;
            text-align: center;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.4);
            box-shadow: inset 0 -4px 0 var(--wood-dark), 0 4px 5px rgba(0,0,0,0.3);
        }
        
        .btn:hover {
            background: #a0522d; /* Lighter wood */
            transform: translateY(-2px);
            box-shadow: inset 0 -3px 0 var(--wood-dark), 0 6px 8px rgba(0,0,0,0.3);
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: inset 0 -2px 0 var(--wood-dark), 0 2px 2px rgba(0,0,0,0.3);
        }

        .footer-message {
            font-size: clamp(1em, 2.5vw, 1.2em);
            text-align: center;
            font-family: 'Open Sans', sans-serif;
            font-weight: 600;
            color: var(--text-dark);
            padding: 20px;
            background: rgba(245, 232, 200, 0.8); /* Slightly transparent parchment */
            border-radius: 10px;
            border: 2px solid #c8b796;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            .heading {
                margin: 30px 0 40px;
            }
            .section {
                padding: 20px;
                margin-bottom: 30px;
            }
            .button-container {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            .btn {
                padding: 12px 20px;
                font-size: 1.1em;
            }
        }

        @media (max-width: 480px) {
            .btn {
                font-size: 1em;
            }
             .section-title::after {
                width: 50px;
                height: 3px;
            }
        }

    </style>
</head>
<body>
    <div class="container">
        <h1 class="heading">All My Sons<br><span>by Arthur Miller</span></h1>
        
        <section class="section">
            <h2 class="section-title">The Treasure Logs { PDFs }</h2>
            <div class="button-container">
                <button class="btn" id="storyBtn">The Full Tale</button>
                <button class="btn" id="scriptBtn">The Script Scroll</button>
                <button class="btn" id="summaryBtn">The Captain's Summary</button>
            </div>
        </section>

        <section class="section">
            <h2 class="section-title">The Crew's Bounties { Character Sketches }</h2>
            <div class="button-container">
                <button class="btn" id="character1Btn">Joe Keller</button>
                <button class="btn" id="character2Btn">Kate Keller</button>
                <button class="btn" id="character3Btn">Chris Keller</button>
                <button class="btn" id="character4Btn">Ann Deever</button>
                <button class="btn" id="character5Btn">George Deever</button>
            </div>
        </section>
        
        <section class="section">
            <h2 class="section-title">Video Sea Chanteys</h2>
            <div class="button-container">
                <button class="btn" id="video1Btn">Summary [in Hindi]</button>
                <button class="btn" id="video2Btn">Summary [in Punjabi]</button>
                <button class="btn" id="video3Btn">Full Play [in Hindi]</button>
            </div>
        </section>
        
        <footer class="section">
            <p class="footer-message">Get ready to level up your grammar skills for our next literary adventure in Semester 3!</p>
        </footer>
    </div>

    <script>
        // PDF Paths
        const pdfPaths = {
            story: "englishstory.pdf",
            script: "englishscript.pdf",
            summary: "Englishsummary.pdf"
        };

        // YouTube Links for Character Sketches
        const characterLinks = {
            char1: "https://youtu.be/APk_bXUSdC0?si=aeWV4490hIX7_HAw",
            char2: "https://youtu.be/8tFDfb3I3A4?si=9PVqH3HEWNPtbcfd",
            char3: "https://youtu.be/Sop5gaCxWs4?si=bwFUM3h-gqba7nbm",
            char4: "https://youtu.be/TEFRgmRo4pc?si=P093zbGnjaQaUe2t",
            char5: "https://youtu.be/Pqk3_J_JPHJQ?si=sERgg4YH38E5WsuC"
        };

        // --- Event Listeners (Functionality remains the same) ---

        const openLink = (url) => window.open(url, '_blank');

        document.getElementById('storyBtn').addEventListener('click', () => openLink(pdfPaths.story));
        document.getElementById('scriptBtn').addEventListener('click', () => openLink(pdfPaths.script));
        document.getElementById('summaryBtn').addEventListener('click', () => openLink(pdfPaths.summary));

        document.getElementById('character1Btn').addEventListener('click', () => openLink(characterLinks.char1));
        document.getElementById('character2Btn').addEventListener('click', () => openLink(characterLinks.char2));
        document.getElementById('character3Btn').addEventListener('click', () => openLink(characterLinks.char3));
        document.getElementById('character4Btn').addEventListener('click', () => openLink(characterLinks.char4));
        document.getElementById('character5Btn').addEventListener('click', () => openLink(characterLinks.char5));

        document.getElementById('video1Btn').addEventListener('click', () => openLink('https://youtu.be/m0Pbjodj6mk?si=HNivmcJa3VLAWX0-'));
        document.getElementById('video2Btn').addEventListener('click', () => openLink('https://youtu.be/B5pF4ffW2DI?si=xvWYdIKDSkTxnh9p'));
        document.getElementById('video3Btn').addEventListener('click', () => openLink('https://youtu.be/Sh1IhIfTHFk?si=Nanrl8pby8Npef-l'));

        // --- Intersection Observer for scroll animations ---
        const sections = document.querySelectorAll('.section');
        const observerOptions = {
            root: null,
            rootMargin: '0px',
            threshold: 0.1
        };

        const observerCallback = (entries, observer) => {
            entries.forEach((entry, index) => {
                if (entry.isIntersecting) {
                    entry.target.style.transitionDelay = `${index * 0.15}s`; // Stagger animation
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                    observer.unobserve(entry.target);
                }
            });
        };

        const sectionObserver = new IntersectionObserver(observerCallback, observerOptions);
        sections.forEach(section => {
            section.style.opacity = '0';
            section.style.transform = 'translateY(30px)';
            section.style.transition = 'opacity 0.6s ease-out, transform 0.6s ease-out';
            sectionObserver.observe(section);
        });
    </script>
</body>
</html>
