<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Grand Line Network | Learning Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --parchment-bg: #f5e8c8;
      --ocean-blue-dark: #0d2145;
      --ocean-blue-light: #1a4a7d;
      --wood-plank: #8B4513;
      --wood-dark: #5a2d0c;
      --text-dark: #3b2f2f;
      --pirate-red: #c0392b;
    }

    body {
      font-family: 'Open Sans', sans-serif;
      background: linear-gradient(to top, var(--ocean-blue-dark), var(--ocean-blue-light));
      background-attachment: fixed;
      color: var(--text-dark);
      margin: 0;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }
    
    .waves-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 150px;
      z-index: 0;
      pointer-events: none;
    }
    .wave {
        position: absolute; bottom: 0; left: 0; width: 200%; height: 100%;
        background-size: 50% 100%; background-repeat: repeat-x;
        animation: moveWaves 15s linear infinite;
    }
    .wave1 {
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100"><path d="M0 50 C 250 100, 250 0, 500 50 S 750 100, 1000 50 L 1000 100 L 0 100 Z" fill="rgba(13,33,69,0.7)"></path></svg>');
        animation-duration: 10s;
    }
    .wave2 {
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100"><path d="M0 60 C 200 120, 300 0, 500 60 S 700 120, 1000 60 L 1000 100 L 0 100 Z" fill="rgba(26,74,125,0.5)"></path></svg>');
        animation-duration: 15s; animation-direction: reverse;
    }

    @keyframes moveWaves { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    h1 {
      font-family: 'Bangers', cursive;
      font-size: clamp(3em, 8vw, 5em);
      margin: 30px 0 50px;
      color: var(--parchment-bg);
      text-shadow: 4px 4px 0px var(--text-dark), 0 0 15px rgba(0,0,0,0.5);
      letter-spacing: 3px;
      animation: stampIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      text-align: center;
      line-height: 1.1;
      position: relative;
      z-index: 1;
    }

    @keyframes stampIn {
        from { opacity: 0; transform: scale(1.5) rotate(-10deg); }
        to { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    .section {
      background: var(--parchment-bg);
      border-radius: 10px;
      padding: 30px;
      margin: 25px;
      width: 90%;
      max-width: 900px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      border: 3px solid #c8b796;
      position: relative;
      z-index: 1;
      opacity: 0;
      transform: translateY(40px);
      animation: bounceInUp 0.8s forwards cubic-bezier(0.25, 0.46, 0.45, 0.94);
      transition: transform 0.3s ease;
    }

    .section:hover {
        transform: translateY(-5px);
    }

    /* Staggered animation for sections */
    .section:nth-of-type(1) { animation-delay: 0.2s; }
    .section:nth-of-type(2) { animation-delay: 0.4s; }
    .section:nth-of-type(3) { animation-delay: 0.6s; }
    .section:nth-of-type(4) { animation-delay: 0.8s; }

    @keyframes bounceInUp {
        0% { opacity: 0; transform: translateY(40px); }
        60% { opacity: 1; transform: translateY(-10px); }
        100% { opacity: 1; transform: translateY(0); }
    }

    .section h2 {
      font-family: 'Bangers', cursive;
      font-size: 2.5rem;
      margin: 0 0 25px 0;
      color: var(--pirate-red);
      position: relative;
      padding-bottom: 10px;
      letter-spacing: 1.5px;
      text-shadow: 1px 1px 0px var(--text-dark);
    }

    .section h2::before {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      max-width: 60px;
      height: 4px;
      background: var(--text-dark);
      border-radius: 2px;
    }
    
    .buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
      padding: 10px 0;
    }

    .buttons button {
      background: var(--wood-plank);
      border: 2px solid var(--wood-dark);
      border-radius: 8px;
      color: #fff;
      padding: 18px 25px;
      font-size: 1.2rem;
      font-family: 'Bangers', cursive;
      font-weight: 400;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease-out;
      min-height: 80px;
      text-shadow: 1px 1px 1px rgba(0,0,0,0.4);
      box-shadow: inset 0 -4px 0 var(--wood-dark), 0 4px 5px rgba(0,0,0,0.3);
    }
    
    .buttons button:hover {
        background: #a0522d; /* Lighter wood */
        transform: translateY(-3px);
        box-shadow: inset 0 -3px 0 var(--wood-dark), 0 6px 8px rgba(0,0,0,0.3);
    }

    .buttons button:active {
        transform: translateY(2px);
        box-shadow: inset 0 -2px 0 var(--wood-dark), 0 2px 2px rgba(0,0,0,0.3);
    }

    /* Responsive Design */
    @media (max-width: 960px) {
      .buttons {
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      }
       h1 { font-size: 4rem; }
      .section h2 { font-size: 2.2rem; }
    }

    @media (max-width: 600px) {
      body { padding: 20px 10px; }
      h1 { font-size: 2.8rem; margin: 20px 0 30px; }
      .section { padding: 20px; margin: 20px 10px; }
      .section h2 { font-size: 2rem; }
      .buttons button { font-size: 1.1rem; padding: 15px 20px; min-height: 70px; }
    }
    @media (max-width: 400px) {
        .buttons { grid-template-columns: 1fr; }
    }

  </style>
</head>
<body>
  <div class="waves-container">
      <div class="wave wave1"></div>
      <div class="wave wave2"></div>
  </div>

  <h1>The Grand Line Network</h1>

  <div class="section">
    <h2>Log Poses from Afar (Online PDFs)</h2>
    <div class="buttons" id="online-pdf-buttons"></div>
  </div>

  <div class="section">
    <h2>The Ship's Library (Local PDFs)</h2>
    <div class="buttons" id="offline-pdf-buttons"></div>
  </div>

  <div class="section">
    <h2>Ancient Poneglyphs (Core Theory)</h2>
    <div class="buttons" id="theory-buttons"></div>
  </div>

  <div class="section">
    <h2>Visual Den Den Mushi (YT Videos)</h2>
    <div class="buttons" id="youtube-buttons"></div>
  </div>

  <script>
    const onlinePDFLinks = [
      "https://drive.google.com/file/d/12H3QcEUdQjqlHS2pC_Rw_nq_1UZmQIz-/view?usp=drive_link",
      "https://drive.google.com/file/d/1TRYUEcWISaTldpyHEElKPZBT4I3cJZJ8/view?usp=drive_link",
      "https://drive.google.com/file/d/1-T-ETVBJJAqjwK9-FKhuCVbv24NI7guX/view?usp=drive_link",
      "https://drive.google.com/file/d/1wUhun1kmOEXta0RtImuf1YD0EK8Awup2/view?usp=drive_link",
      "https://drive.google.com/file/d/1nKi1gxibLfnmuRT23Ph88HFGxVhJdOJd/view?usp=drive_link",
      "https://drive.google.com/file/d/16_cccbggucBAktRI2P2kA7ZefnEHXMjN/view?usp=drive_link",
      "https://drive.google.com/file/d/1bXr_KyW4Ke7y7wHxjxdEIIBoIXdaAWRO/view?usp=drive_link",
      "https://drive.google.com/file/d/1qyROLrVMbjO6W7tvRnCCZLVFmWktBoFV/view?usp=drive_link",
      "https://drive.google.com/file/d/19wb7ynUES-jvK1FtJDuMB2Mh5asePMdy/view?usp=drive_link"
    ];

    const offlinePDFPaths = [
      "ch 2 refrence model of network.pdf", "ch 7 transport layer.pdf", "ch 8 application layer.pdf",
      "ch 3 TCP-IP protocol suite.pdf", "ch 6 network layer.pdf", "ch 5 data link layer.pdf",
      "ch 4 internet protocol.pdf", "ch 1 introduction to network.pdf", "ch 9 network security.pdf"
    ];

    const theoryLinks = [
      "https://www.tutorialspoint.com/Reference-Models-in-Computer-Network", "https://www.geeksforgeeks.org/transport-layer-in-osi-model/",
      "https://www.geeksforgeeks.org/application-layer-in-osi-model/", "https://www.geeksforgeeks.org/tcp-ip-model/",
      "https://www.geeksforgeeks.org/network-layer-in-osi-model/", "https://www.geeksforgeeks.org/data-link-layer/",
      "https://www.geeksforgeeks.org/types-of-internet-protocols/", "https://www.geeksforgeeks.org/what-is-computer-networking/",
      "https://www.geeksforgeeks.org/network-security/"
    ];

    const youtubeLinks = [
      "https://youtu.be/1msEo8PIcbw?si=vViE2qlEU04iTfBY", "https://youtube.com/playlist?list=PLHQAlOcTuuT3HbVd9XG42a0WtC1MRKRvO&si=u9lKRrr_lgK6Pent",
      "https://www.youtube.com/live/XJasQKX2fsY?si=hGjjSuI_10yAu4db", "https://youtu.be/TVr0RZ1-74g?si=o80Jrrr21RcBEbgS",
      "https://youtube.com/playlist?list=PL1KcDRI9303dr0YaWBF_ngoOrBwJjhWFI&si=ZG_UivAxnv2crus_", "https://youtu.be/yY0NtpmVB_A?si=smPhQQ6NfLfh27JK",
      "https://youtube.com/playlist?list=PLqleLpAMfxGCUpDRFUnLKeDrgBsPOwTQK&si=AEm-fEek7bO-vj-B", "https://youtu.be/BdDd_Ez4iZs?si=dE2fi_K6G6DSR_yr",
      "https://youtube.com/playlist?list=PLxCzCOWd7aiGFBD2-2joCpWOLUrDLvVV_&si=tszBCKCiuj2qPbm0", "https://youtu.be/1V9mhVgVH3A?si=d-y6hUfuXq_BuzAV",
      "https://youtu.be/q3Z3Qa1UNBA?si=VcTygbcOS4uKkc61"
    ];

    const buttonNames = {
      online: [ "Reference Models", "Transport Layer", "Application Layer", "TCP/IP Suite", "Network Layer", "Data Link Layer", "Internet Protocol", "Intro to Network", "Network Security" ],
      offline: [ "Reference Models", "Transport Layer", "Application Layer", "TCP/IP Suite", "Network Layer", "Data Link Layer", "Internet Protocol", "Intro to Network", "Network Security" ],
      theory: [ "Reference Models", "Transport Layer", "Application Layer", "TCP/IP Suite", "Network Layer", "Data Link Layer", "Internet Protocol", "Intro to Network", "Network Security" ],
      youtube: [ "Reference Models", "Transport Layer [PL]", "Application Layer", "TCP/IP Suite", "Network Layer [PL]", "Data Link Layer", "Intro to Network", "Network Security", "Comp. Networks [PL]", "Comp. Networks [OS]", "CN [OS GATE]" ]
    };

    function createButtons(containerId, links, names) {
        const container = document.getElementById(containerId);
        if (!container) return;

        links.forEach((link, index) => {
            const button = document.createElement("button");
            button.textContent = names[index] || `Link ${index + 1}`;
            button.setAttribute('title', `Navigate to: ${names[index] || link}`);
            button.addEventListener("click", () => window.open(link, "_blank"));
            container.appendChild(button);
        });
    }

    createButtons("online-pdf-buttons", onlinePDFLinks, buttonNames.online);
    createButtons("offline-pdf-buttons", offlinePDFPaths, buttonNames.offline);
    createButtons("theory-buttons", theoryLinks, buttonNames.theory);
    createButtons("youtube-buttons", youtubeLinks, buttonNames.youtube);

  </script>
</body>
</html>
