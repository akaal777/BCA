<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Network Hub | Learning Center</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-dark: #0f0c29;
      --secondary-dark: #302b63;
      --tertiary-dark: #24243e;
      --text-light: #f0f0f0;
      --glow-accent: #6a82fb;
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(45deg, var(--primary-dark), var(--secondary-dark), var(--tertiary-dark));
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: var(--text-light);
      margin: 0;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    h1 {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: clamp(2.5em, 8vw, 4.5em);
      margin: 30px 0 50px;
      background: linear-gradient(90deg, #fc5c7d, var(--glow-accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
      text-align: center;
      line-height: 1.2;
      animation: fadeInDown 1.2s ease-out;
    }

    @keyframes fadeInDown {
        from { opacity: 0; transform: translateY(-30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .section {
      background: var(--glass-bg);
      border-radius: 20px;
      padding: 30px;
      margin: 20px;
      width: 90%;
      max-width: 900px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 0.8s forwards cubic-bezier(0.25, 0.46, 0.45, 0.94);
      transition: transform 0.3s ease;
    }
    
    .section:hover {
        transform: translateY(-5px);
    }

    /* Staggered animation for sections */
    .section:nth-of-type(1) { animation-delay: 0.3s; }
    .section:nth-of-type(2) { animation-delay: 0.5s; }
    .section:nth-of-type(3) { animation-delay: 0.7s; }
    .section:nth-of-type(4) { animation-delay: 0.9s; }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .section h2 {
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 2.2rem;
      margin: 0 0 25px 0;
      color: var(--text-light);
      position: relative;
      padding-bottom: 10px;
    }

    .section h2::before {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      width: 50px;
      height: 3px;
      background: var(--glow-accent);
      border-radius: 2px;
    }
    
    .buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
    }

    .buttons button {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      color: #fff;
      padding: 18px 25px;
      font-size: 1.1rem;
      font-family: 'Poppins', sans-serif;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.3s ease;
      min-height: 70px;
      position: relative;
      overflow: hidden;
    }
    
    .buttons button:hover, .buttons button:focus {
        background-color: rgba(255, 255, 255, 0.25);
        box-shadow: 0 0 15px var(--glow-accent);
        border-color: var(--glow-accent);
        transform: translateY(-3px);
        outline: none;
    }
    
    .buttons button::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        transition: left 0.5s ease;
    }

    .buttons button:hover::before {
        left: 100%;
    }

    /* Responsive Design */
    @media (max-width: 960px) {
      .buttons {
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      }
       h1 { font-size: 3.5rem; }
      .section h2 { font-size: 2rem; }
    }

    @media (max-width: 600px) {
      body { padding: 20px 10px; }
      h1 { font-size: 2.5rem; margin: 20px 0 30px; }
      .section { padding: 20px; margin: 20px 10px; }
      .section h2 { font-size: 1.8rem; }
      .buttons button { font-size: 1rem; padding: 15px 20px; min-height: 60px; }
    }
    @media (max-width: 400px) {
        .buttons { grid-template-columns: 1fr; }
    }

  </style>
</head>
<body>

  <h1>Computer Network </h1>

  <div class="section">
    <h2>Online Resources (PDFs)</h2>
    <div class="buttons" id="online-pdf-buttons"></div>
  </div>

  <div class="section">
    <h2>Local Files (PDFs)</h2>
    <div class="buttons" id="offline-pdf-buttons"></div>
  </div>

  <div class="section">
    <h2>Core Theory (Web Articles)</h2>
    <div class="buttons" id="theory-buttons"></div>
  </div>

  <div class="section">
    <h2>Video Lectures (YouTube)</h2>
    <div class="buttons" id="youtube-buttons"></div>
  </div>

  <script>
    // Data for the buttons remains the same as it is functional and well-structured.
    const onlinePDFLinks = [
      "https://drive.google.com/file/d/12H3QcEUdQjqlHS2pC_Rw_nq_1UZmQIz-/view?usp=drive_link", "https://drive.google.com/file/d/1TRYUEcWISaTldpyHEElKPZBT4I3cJZJ8/view?usp=drive_link",
      "https://drive.google.com/file/d/1-T-ETVBJJAqjwK9-FKhuCVbv24NI7guX/view?usp=drive_link", "https://drive.google.com/file/d/1wUhun1kmOEXta0RtImuf1YD0EK8Awup2/view?usp=drive_link",
      "https://drive.google.com/file/d/1nKi1gxibLfnmuRT23Ph88HFGxVhJdOJd/view?usp=drive_link", "https://drive.google.com/file/d/16_cccbggucBAktRI2P2kA7ZefnEHXMjN/view?usp=drive_link",
      "https://drive.google.com/file/d/1bXr_KyW4Ke7y7wHxjxdEIIBoIXdaAWRO/view?usp=drive_link", "https://drive.google.com/file/d/1qyROLrVMbjO6W7tvRnCCZLVFmWktBoFV/view?usp=drive_link",
      "https://drive.google.com/file/d/19wb7ynUES-jvK1FtJDuMB2Mh5asePMdy/view?usp=drive_link"
    ];
    const offlinePDFPaths = [
      "ch 2 refrence model of network.pdf", "ch 7 transport layer.pdf", "ch 8 application layer.pdf", "ch 3 TCP-IP protocol suite.pdf", 
      "ch 6 network layer.pdf", "ch 5 data link layer.pdf", "ch 4 internet protocol.pdf", "ch 1 introduction to network.pdf", "ch 9 network security.pdf"
    ];
    const theoryLinks = [
      "https://www.tutorialspoint.com/Reference-Models-in-Computer-Network", "https://www.geeksforgeeks.org/transport-layer-in-osi-model/",
      "https://www.geeksforgeeks.org/application-layer-in-osi-model/", "https://www.geeksforgeeks.org/tcp-ip-model/",
      "https://www.geeksforgeeks.org/network-layer-in-osi-model/", "https://www.geeksforgeeks.org/data-link-layer/",
      "https://www.geeksforgeeks.org/types-of-internet-protocols/", "https://www.geeksforgeeks.org/what-is-computer-networking/",
      "https://www.geeksforgeeks.org/network-security/"
    ];
    const youtubeLinks = [
      "https://youtu.be/1msEo8PIcbw?si=vViE2qlEU04iTfBY", "https://youtube.com/playlist?list=PLHQAlOcTuuT3HbVd9XG42a0WtC1MRKRvO&si=u9lKRrr_lgK6Pent",
      "https://www.youtube.com/live/XJasQKX2fsY?si=hGjjSuI_10yAu4db", "https://youtu.be/TVr0RZ1-74g?si=o80Jrrr21RcBEbgS",
      "https://youtube.com/playlist?list=PL1KcDRI9303dr0YaWBF_ngoOrBwJjhWFI&si=ZG_UivAxnv2crus_", "https://youtu.be/yY0NtpmVB_A?si=smPhQQ6NfLfh27JK",
      "https://youtube.com/playlist?list=PLqleLpAMfxGCUpDRFUnLKeDrgBsPOwTQK&si=AEm-fEek7bO-vj-B", "https://youtu.be/BdDd_Ez4iZs?si=dE2fi_K6G6DSR_yr",
      "https://youtube.com/playlist?list=PLxCzCOWd7aiGFBD2-2joCpWOLUrDLvVV_&si=tszBCKCiuj2qPbm0", "https://youtu.be/1V9mhVgVH3A?si=d-y6hUfuXq_BuzAV",
      "https://youtu.be/q3Z3Qa1UNBA?si=VcTygbcOS4uKkc61"
    ];
    const buttonNames = {
      online: [ "Reference Models", "Transport Layer", "Application Layer", "TCP/IP Suite", "Network Layer", "Data Link Layer", "Internet Protocol", "Intro to Network", "Network Security" ],
      offline: [ "Reference Models", "Transport Layer", "Application Layer", "TCP/IP Suite", "Network Layer", "Data Link Layer", "Internet Protocol", "Intro to Network", "Network Security" ],
      theory: [ "Reference Models", "Transport Layer", "Application Layer", "TCP/IP Suite", "Network Layer", "Data Link Layer", "Internet Protocol", "Intro to Network", "Network Security" ],
      youtube: [ "Reference Models", "Transport Layer [PL]", "Application Layer", "TCP/IP Suite", "Network Layer [PL]", "Data Link Layer", "Intro to Network", "Network Security", "Comp. Networks [PL]", "Comp. Networks [OS]", "CN [OS GATE]" ]
    };

    function createButtons(containerId, links, names) {
        const container = document.getElementById(containerId);
        if (!container) return;
        links.forEach((link, index) => {
            const button = document.createElement("button");
            button.textContent = names[index] || `Link ${index + 1}`;
            button.setAttribute('title', `Open: ${names[index] || link}`);
            button.addEventListener("click", () => window.open(link, "_blank"));
            container.appendChild(button);
        });
    }

    createButtons("online-pdf-buttons", onlinePDFLinks, buttonNames.online);
    createButtons("offline-pdf-buttons", offlinePDFPaths, buttonNames.offline);
    createButtons("theory-buttons", theoryLinks, buttonNames.theory);
    createButtons("youtube-buttons", youtubeLinks, buttonNames.youtube);
  </script>
</body>
</html>
