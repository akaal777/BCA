<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baratie Learning Galley | Modern Punjabi Hub</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-deep: #0a1118;
            --accent-gold: #c5a059;
            --glass-white: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8f9fa;
            --text-muted: #94a3b8;
            --serif-font: 'Playfair Display', serif;
            --sans-font: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(197, 160, 89, 0.05) 0%, transparent 30%),
                radial-gradient(circle at 100% 100%, rgba(27, 38, 59, 0.3) 0%, transparent 30%);
            color: var(--text-primary);
            font-family: var(--sans-font);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Subtler Animated Waves */
        .waves-container {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 15vh;
            z-index: -1;
            opacity: 0.4;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 4rem 1.5rem;
        }

        /* --- Elegant Header --- */
        header {
            text-align: center;
            margin-bottom: 5rem;
            opacity: 0;
            transform: translateY(-20px);
            animation: fadeInDown 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        header span {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--accent-gold);
            font-weight: 600;
        }

        h1 {
            font-family: var(--serif-font);
            font-size: clamp(2.5rem, 8vw, 4rem);
            margin-top: 1rem;
            font-style: italic;
        }

        /* --- Modern Card Grid --- */
        .main-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .category-card {
            background: var(--glass-white);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 3rem 2rem;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(30px);
        }

        .category-card.show {
            opacity: 1;
            transform: translateY(0);
        }

        .category-card:hover {
            border-color: var(--accent-gold);
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .card-icon {
            font-size: 2.5rem;
            color: var(--accent-gold);
            margin-bottom: 1.5rem;
            transition: transform 0.5s ease;
        }

        .category-card:hover .card-icon {
            transform: scale(1.1) rotate(5deg);
        }

        .category-card h2 {
            font-family: var(--serif-font);
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .category-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 300;
        }

        /* --- Modern Modal --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 8, 12, 0.9);
            backdrop-filter: blur(15px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .modal.active { display: flex; opacity: 1; }

        .modal-content {
            background: #121921;
            border: 1px solid var(--glass-border);
            padding: 3rem;
            border-radius: 24px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal.active .modal-content { transform: scale(1); }

        .modal-content h2 {
            font-family: var(--serif-font);
            font-size: 2rem;
            margin-bottom: 2rem;
        }

        .option-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .option-btn {
            padding: 1.2rem;
            border-radius: 12px;
            font-family: var(--sans-font);
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid var(--glass-border);
        }

        .online-btn {
            background: var(--accent-gold);
            color: #000;
            border: none;
        }

        .online-btn:hover { background: #e0b970; transform: scale(1.02); }

        .offline-btn {
            background: transparent;
            color: var(--text-primary);
        }

        .offline-btn:hover { background: var(--glass-white); border-color: var(--accent-gold); }

        .close-link {
            display: inline-block;
            margin-top: 2rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
            border-bottom: 1px solid transparent;
            transition: 0.3s;
            cursor: pointer;
        }

        .close-link:hover { color: var(--text-primary); border-color: var(--accent-gold); }

        /* --- Animations & Responsive --- */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.8rem; }
            .main-buttons { grid-template-columns: 1fr; }
            .modal-content { padding: 2rem; }
        }
    </style>
</head>
<body>

    <div class="waves-container">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320" style="height:100%; width:100%">
            <path fill="#c5a059" fill-opacity="0.05" d="M0,160L48,176C96,192,192,224,288,213.3C384,203,480,149,576,149.3C672,149,768,203,864,213.3C960,224,1056,192,1152,165.3C1248,139,1344,117,1392,106.7L1440,96L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
        </svg>
    </div>

    <div class="container">
        <header>
            <span>Poems, Sample Paper And Grammar</span>
            <h1>Punjabi Galley</h1>
        </header>

        <div class="main-buttons">
            <div class="category-card" onclick="showOptions('poems')">
                <i class="fa-solid fa-feather-pointed card-icon"></i>
                <h2>Poems</h2>
                <p>Punjabi Poetry & Lyrical Wisdom</p>
            </div>

            <div class="category-card" onclick="showOptions('sample')">
                <i class="fa-solid fa-scroll card-icon"></i>
                <h2>Sample Papers</h2>
                <p>Examination Blueprints & Charts</p>
            </div>

            <div class="category-card" onclick="showOptions('grammar')">
                <i class="fa-solid fa-compass card-icon"></i>
                <h2>Grammar</h2>
                <p>Language Rules & Structural Guides</p>
            </div>
        </div>

        <div id="optionsModal" class="modal">
            <div class="modal-content">
                <p style="color:var(--accent-gold); letter-spacing: 2px; font-size: 0.7rem; font-weight: 600; margin-bottom: 0.5rem;">CHOOSE YOUR CHART</p>
                <h2 id="modalTitle">Category</h2>
                <div class="option-group">
                    <button class="option-btn online-btn" onclick="handleOption('online')">
                        <i class="fa-solid fa-satellite-dish" style="margin-right: 8px;"></i> Online View
                    </button>
                    <button class="option-btn offline-btn" onclick="handleOption('offline')">
                        <i class="fa-solid fa-book-bookmark" style="margin-right: 8px;"></i>Offline Download
                    </button>
                </div>
                <a class="close-link" onclick="closeModal()">Return to Galley</a>
            </div>
        </div>
    </div>

    <script>
        const pdfPaths = {
            poems: {
                online: 'https://drive.google.com/file/d/1qBQ48x0yNMBaXi7PgdCNQh_gfsWgbTKq/view?usp=drive_link',
                offline: 'punjabi_poem.pdf'
            },
            sample: {
                online: 'https://drive.google.com/file/d/1XMkxDESdz2B2AUfKadR6E_3y5UnfpVTW/view?usp=drive_link',
                offline: 'punjabi_sample_paper.pdf'
            },
            grammar: {
                online: 'https://drive.google.com/file/d/1HEoPcmsmINWeHx89npPst_xE7jhV1Pc3/view?usp=drive_link',
                offline: 'punjabi_grammar.pdf'
            }
        };

        let currentCategory = '';
        const modal = document.getElementById('optionsModal');

        function showOptions(category) {
            currentCategory = category;
            const title = document.getElementById('modalTitle');
            let friendlyName = category === 'sample' ? "Sample Papers" : category.charAt(0).toUpperCase() + category.slice(1);
            title.textContent = friendlyName;
            modal.classList.add('active');
        }

        function closeModal() { modal.classList.remove('active'); }

        function handleOption(type) {
            const path = pdfPaths[currentCategory]?.[type];
            if (path) {
                if (type === 'online') {
                    window.open(path, '_blank');
                } else {
                    const link = document.createElement('a');
                    link.href = path;
                    link.download = path;
                    link.click();
                }
            }
            closeModal();
        }

        // Scroll Reveal Animation
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry, index) => {
                if (entry.isIntersecting) {
                    setTimeout(() => {
                        entry.target.classList.add('show');
                    }, index * 150);
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.category-card').forEach(card => observer.observe(card));

        // Close on outside click
        window.onclick = (e) => { if (e.target == modal) closeModal(); }
    </script>
</body>
</html>
