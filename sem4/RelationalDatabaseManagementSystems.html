<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loguetown Archives - DBMS Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --parchment-bg: #f5e8c8;
            --wood-bg: #4a2c2a;
            --text-dark: #3a2d2d;
            --accent-red: #c0392b;
            --border-color: #c8b796;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--wood-bg);
            background-image: linear-gradient(rgba(74, 44, 42, 0.8), rgba(74, 44, 42, 0.95)), 
                              url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><g fill="%233a2d2d" fill-opacity="0.1"><rect x="50" width="50" height="50"/><rect y="50" width="50" height="50"/></g></svg>');
            background-attachment: fixed;
            color: var(--text-dark);
            font-family: 'Open Sans', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            animation: fadeInContainer 1s ease-out forwards;
        }

        @keyframes fadeInContainer {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .main-heading {
            text-align: center;
            font-family: 'Bangers', cursive;
            font-size: 4.5rem;
            margin-bottom: 3rem;
            color: var(--parchment-bg);
            text-shadow: 4px 4px 0px var(--text-dark), 0 0 10px rgba(0,0,0,0.5);
            letter-spacing: 2px;
            animation: slideInDown 1s ease-out;
        }

        @keyframes slideInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section {
            background: var(--parchment-bg);
            border-radius: 10px;
            padding: 2.5rem;
            margin-bottom: 3rem;
            border: 3px solid var(--border-color);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transform: translateY(30px);
            animation: slideUpFadeIn 0.8s ease-out forwards;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .section:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        @keyframes slideUpFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .sub-section {
            margin: 2rem 0;
        }

        .sub-section h3 {
            font-family: 'Bangers', cursive;
            color: var(--accent-red);
            font-size: 1.8rem;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .btn {
            background: #a0522d; /* Lighter wood */
            border: 2px solid var(--wood-bg);
            padding: 0.8rem 1.5rem;
            color: var(--parchment-bg);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Open Sans', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease-out;
            text-align: center;
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.3), 0 3px 5px rgba(0,0,0,0.3);
            opacity: 0;
            transform: translateY(10px);
            animation: popIn 0.5s ease-out forwards;
        }

        .btn:hover {
            background-color: #8B4513; /* Darker wood on hover */
            transform: translateY(-2px);
            box-shadow: inset 0 -2px 0 rgba(0,0,0,0.3), 0 5px 8px rgba(0,0,0,0.4);
        }

        .btn:active {
            transform: translateY(1px);
            box-shadow: inset 0 -1px 0 rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.4);
        }

        @keyframes popIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-title {
            font-family: 'Bangers', cursive;
            font-size: 2.5rem;
            margin-bottom: 2rem;
            color: var(--text-dark);
            border-bottom: 3px solid var(--accent-red);
            padding-bottom: 0.8rem;
        }

        @media (max-width: 768px) {
            .main-heading { font-size: 3.5rem; }
            .section { padding: 2rem; }
            .section-title { font-size: 2rem; }
            .sub-section h3 { font-size: 1.5rem; }
            .button-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 480px) {
            .main-heading { font-size: 2.8rem; }
            .section-title { font-size: 1.8rem; }
            .container { padding: 20px 15px; }
        }

    </style>
</head>
<body>

    <div class="container">
        <h1 class="main-heading">Loguetown Archives {DBMS}</h1>
        
        <section class="section" style="animation-delay: 0.2s;">
            <h2 class="section-title">East Blue Scrolls</h2>
            <div class="sub-section">
                <h3>Online Sea Charts</h3>
                <div class="button-grid" id="online-notes"></div>
            </div>
            <div class="sub-section">
                <h3>Local Captain's Logs</h3>
                <div class="button-grid" id="offline-notes"></div>
            </div>
        </section>

        <section class="section" style="animation-delay: 0.4s;">
            <h2 class="section-title">Swordsman's Wisdom {Theory}</h2>
            <div class="button-grid" id="theory"></div>
        </section>

        <section class="section" style="animation-delay: 0.6s;">
            <h2 class="section-title">Tavern Tales (Videos)</h2>
            <div class="button-grid" id="youtube"></div>
        </section>
    </div>

    <script>
        const resources = {
            onlineNotes: [
                { name: "DBMS Core Archives", link: "https://drive.google.com/file/d/1vZKHyAqOk_jrYFgFo8mxTSNzPX62uayk/view?usp=drive_link" },
                { name: "RDBMS Datastream", link: "https://drive.google.com/file/d/1VDKhPXCvJzNWryuxoLGLfTP9jm0Wyv98/view?usp=drive_link" },
            ],
            offlineNotes: [
                { name: "DBMS Schematics [PDF]", link: "RDBMS NOTES.pdf" },
                { name: "RDBMS Blueprints [PDF]", link: "RDBMS.pdf" },
                { name : "Concurrency Protocols [TXT]", link: "Concurrency Control.txt" },
                { name : "Oracle Interface Guide [TXT]", link: "Oracel.txt" },
                { name : "SQL Command Matrix [TXT]", link: "WorkingwithSQL.txt" },
            ],
            theory: [
                { name: "Intro to DBMS Structures", link: "https://www.geeksforgeeks.org/dbms/" },
                { name: "File System Architecture", link: "https://www.geeksforgeeks.org/file-organization-in-dbms-set-1/" },
                { name: "Transaction Processing", link: "https://www.geeksforgeeks.org/transaction-management/" },
                { name: "Transaction Matrix [GitHub]", link: "https://www.geeksforgeeks.org/transaction-management/" },
                { name: "Concurrency Control Systems", link: "https://herovired.com/learning-hub/topics/concurrency-control-in-dbms/" },
            ],
            youtube: [
                { name: "DBMS (5hr) (5 min Engineering) [Oneshot]", link: "https://youtu.be/jzuzxEFoiss?si=q9oCv8c_iQMfQSgz" },
                { name: "DBMS  [Gate Smashers] Playlist", link: "https://youtube.com/playlist?list=PLxCzCOWd7aiFAN6I8CuViBuCdJgiOkT2Y&si=mmuEp4bR2udjq74l" },
                { name: "Database [5 Min Eng.]", link: "https://youtube.com/playlist?list=PLYwpaL_SFmcBU4HS74xGTK1cAFbY0rdVY&si=CJ1YvowTK8Kxfmlu" },
                { name: "DBMS Oneshot [Knowledge Gate]", link: "https://youtu.be/FchQ6wZVqsA?si=GUfQ54T_nLXNMP0s" },
                { name: "DBMS One Shot", link: "https://youtu.be/scxc0FXp2rg?si=Na8jvuGRaTDpGI9t" },
                { name: "DBMS  [GeeksforGeeks]", link: "https://youtube.com/playlist?list=PLEBuowGoCtr3WLkRIHmIA2yS0jvSs9Lpt&si=IfIPJPuKmq0i3UE5" },
                { name: "Data Recovery Protocols", link: "https://youtu.be/1pSxXwy0qiE?si=pYViwv79sNFjs_qH" },
                { name: "Database Recovery[Types of Failure]", link: "https://youtu.be/eq2EMu1Mh-w?si=f6ga1i660MLWO35h" },
                { name: "Relational Query Language [SQL]", link: "https://youtu.be/Ktri0Jmeh-c?si=pRed0rmSYNwMdXvq" },
            ]
        };

        function createButton(parentId, items, delayStart = 0) {
            const container = document.getElementById(parentId);
            if (!container) return;
            items.forEach((item, index) => {
                const button = document.createElement('button');
                button.className = 'btn';
                button.textContent = item.name;
                button.onclick = () => window.open(item.link, '_blank');
                button.style.animationDelay = `${delayStart + index * 0.08}s`;
                container.appendChild(button);
            });
        }

        window.onload = () => {
            const sections = document.querySelectorAll('.section');
            sections.forEach((section, index) => {
                section.style.animationDelay = `${0.2 + index * 0.3}s`;
                const buttonDelayStart = 0.2 + index * 0.3 + 0.4;

                if (section.querySelector('#online-notes')) {
                     createButton('online-notes', resources.onlineNotes, buttonDelayStart);
                }
                if (section.querySelector('#offline-notes')) {
                     createButton('offline-notes', resources.offlineNotes, buttonDelayStart);
                }
                if (section.querySelector('#theory')) {
                     createButton('theory', resources.theory, buttonDelayStart);
                }
                if (section.querySelector('#youtube')) {
                     createButton('youtube', resources.youtube, buttonDelayStart);
                }
            });
        };
    </script>
</body>
</html>
