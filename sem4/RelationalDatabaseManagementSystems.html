<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loguetown Archives | DBMS Premium Portal</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #05070a;
            --accent-gold: #c2a371;
            --accent-blue: #3b82f6;
            --glass-bg: rgba(15, 23, 42, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(194, 163, 113, 0.05) 0%, transparent 40%);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Smooth Scroll reveal class */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 4rem 1.5rem;
        }

        /* --- Header --- */
        header {
            text-align: center;
            margin-bottom: 6rem;
        }

        header span {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: var(--accent-gold);
            display: block;
            margin-bottom: 1rem;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 700;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- Section Styling --- */
        .section {
            margin-bottom: 5rem;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .section-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .line {
            flex-grow: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--glass-border), transparent);
        }

        .sub-heading {
            color: var(--accent-gold);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 2rem 0 1rem;
        }

        /* --- Resource Grid & Cards --- */
        .resource-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.25rem;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 1.5rem;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: inherit;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            backdrop-filter: blur(12px);
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--accent-gold);
            transform: translateY(-5px);
            box-shadow: 0 15px 30px -10px rgba(0,0,0,0.5);
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-title {
            font-weight: 500;
            font-size: 1.05rem;
            color: var(--text-primary);
        }

        .card-tag {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-icon {
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-gold);
            transition: 0.3s;
        }

        .card:hover .card-icon {
            background: var(--accent-gold);
            color: var(--bg-dark);
            transform: rotate(8deg);
        }

        /* --- Footer --- */
        footer {
            text-align: center;
            padding: 4rem 0;
            border-top: 1px solid var(--glass-border);
            color: var(--text-secondary);
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        /* --- Responsive Adjustments --- */
        @media (max-width: 768px) {
            .container { padding: 2rem 1rem; }
            .section-header h2 { font-size: 1.4rem; }
            .resource-grid { grid-template-columns: 1fr; }
            h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="reveal">
            <span>Premium Learning Directory</span>
            <h1>Data-Base Manaegent System (DBMS)</h1>
        </header>

        <section class="section reveal">
            <div class="section-header">
                <h2>DBMS / RDBMS  </h2>
                <div class="line"></div>
            </div>
            
            <div class="sub-heading">Online Charts</div>
            <div class="resource-grid" id="online-notes-grid"></div>

            <div class="sub-heading">Local Captain's Logs</div>
            <div class="resource-grid" id="offline-notes-grid"></div>
        </section>

        <section class="section reveal">
            <div class="section-header">
                <h2>Core Theory</h2>
                <div class="line"></div>
            </div>
            <div class="resource-grid" id="theory-grid"></div>
        </section>

        <section class="section reveal">
            <div class="section-header">
                <h2>Videos</h2>
                <div class="line"></div>
            </div>
            <div class="resource-grid" id="youtube-grid"></div>
        </section>

        <footer>
            DBMS ARCHIVE &copy; 2024 | DESIGNED FOR THE GRAND LINE
        </footer>
    </div>

    <script>
        const resources = {
            onlineNotes: [
                { name: "DBMS Core Archives", link: "https://drive.google.com/file/d/1vZKHyAqOk_jrYFgFo8mxTSNzPX62uayk/view?usp=drive_link", tag: "Drive PDF", icon: "fa-cloud" },
                { name: "RDBMS Datastream", link: "https://drive.google.com/file/d/1VDKhPXCvJzNWryuxoLGLfTP9jm0Wyv98/view?usp=drive_link", tag: "Drive PDF", icon: "fa-database" },
            ],
            offlineNotes: [
                { name: "DBMS Schematics", link: "RDBMS NOTES.pdf", tag: "PDF File", icon: "fa-file-pdf" },
                { name: "RDBMS Blueprints", link: "RDBMS.pdf", tag: "PDF File", icon: "fa-file-pdf" },
                { name : "Concurrency Protocols", link: "Concurrency Control.txt", tag: "Text Doc", icon: "fa-file-lines" },
                { name : "Oracle Interface Guide", link: "Oracel.txt", tag: "Text Doc", icon: "fa-terminal" },
                { name : "SQL Command Matrix", link: "WorkingwithSQL.txt", tag: "Text Doc", icon: "fa-code" },
            ],
            theory: [
                { name: "Intro to DBMS Structures", link: "https://www.geeksforgeeks.org/dbms/", tag: "Web Guide", icon: "fa-book" },
                { name: "File System Architecture", link: "https://www.geeksforgeeks.org/file-organization-in-dbms-set-1/", tag: "Documentation", icon: "fa-sitemap" },
                { name: "Transaction Processing", link: "https://www.geeksforgeeks.org/transaction-management/", tag: "Web Guide", icon: "fa-rotate" },
                { name: "Concurrency Control", link: "https://herovired.com/learning-hub/topics/concurrency-control-in-dbms/", tag: "Theory", icon: "fa-shield-halved" },
            ],
            youtube: [
                { name: "DBMS Masterclass (5hr)", link: "https://youtu.be/jzuzxEFoiss?si=q9oCv8c_iQMfQSgz", tag: "Video", icon: "fa-play" },
                { name: "Gate Smashers Playlist", link: "https://youtube.com/playlist?list=PLxCzCOWd7aiFAN6I8CuViBuCdJgiOkT2Y&si=mmuEp4bR2udjq74l", tag: "Playlist", icon: "fa-list-ul" },
                { name: "5 Minute Engineering", link: "https://youtube.com/playlist?list=PLYwpaL_SFmcBU4HS74xGTK1cAFbY0rdVY&si=CJ1YvowTK8Kxfmlu", tag: "Playlist", icon: "fa-bolt" },
                { name: "Knowledge Gate OneShot", link: "https://youtu.be/FchQ6wZVqsA?si=GUfQ54T_nLXNMP0s", tag: "Video", icon: "fa-play" },
                { name: "Relational Query [SQL]", link: "https://youtu.be/Ktri0Jmeh-c?si=pRed0rmSYNwMdXvq", tag: "Video", icon: "fa-table" },
            ]
        };

        function renderCards(gridId, data) {
            const grid = document.getElementById(gridId);
            data.forEach(item => {
                const card = document.createElement('a');
                card.className = 'card';
                card.href = item.link;
                card.target = '_blank';
                card.innerHTML = `
                    <div class="card-info">
                        <span class="card-tag">${item.tag}</span>
                        <span class="card-title">${item.name}</span>
                    </div>
                    <div class="card-icon">
                        <i class="fa-solid ${item.icon}"></i>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Initialize Rendering
        renderCards('online-notes-grid', resources.onlineNotes);
        renderCards('offline-notes-grid', resources.offlineNotes);
        renderCards('theory-grid', resources.theory);
        renderCards('youtube-grid', resources.youtube);

        // Intersection Observer for Animations
        const observerOptions = { threshold: 0.1 };
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                }
            });
        }, observerOptions);

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    </script>
</body>
</html>
