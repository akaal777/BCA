<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCA 4th Sem - Modern Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #111827; /* Dark Slate Blue */
            --secondary-bg: rgba(31, 41, 55, 0.5); /* Semi-transparent darker slate */
            --accent-color: #38BDF8; /* Bright Sky Blue */
            --accent-glow: rgba(56, 189, 248, 0.2);
            --text-primary: #F9FAFB; /* Off-white */
            --text-secondary: #9CA3AF; /* Light gray */
            --border-color: rgba(56, 189, 248, 0.2);
            --border-hover: rgba(56, 189, 248, 0.7);
        }

        body {
            margin: 0;
            padding: 2rem;
            background-color: var(--primary-bg);
            font-family: 'Poppins', sans-serif;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            box-sizing: border-box;
        }

        /* Modern Animated Background */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
        }

        .shape {
            position: absolute;
            list-style: none;
            display: block;
            width: 40px;
            height: 40px;
            background-color: var(--secondary-bg);
            border: 1px solid var(--border-color);
            bottom: -150px;
            animation: rise 25s infinite linear;
        }
        .shape:nth-child(1) { left: 10%; animation-duration: 15s; }
        .shape:nth-child(2) { left: 20%; width: 80px; height: 80px; animation-duration: 12s; animation-delay: 2s; }
        .shape:nth-child(3) { left: 35%; animation-duration: 20s; }
        .shape:nth-child(4) { left: 50%; width: 60px; height: 60px; animation-duration: 18s; animation-delay: 5s; }
        .shape:nth-child(5) { left: 65%; animation-duration: 14s; }
        .shape:nth-child(6) { left: 80%; width: 100px; height: 100px; animation-duration: 22s; animation-delay: 7s; }

        @keyframes rise {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
                border-radius: 0;
            }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
                border-radius: 50%;
            }
        }

        header {
            margin-bottom: 4rem;
            text-align: center;
            opacity: 0;
            animation: fadeInDown 1s forwards cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        h1 {
            font-size: 3.5em;
            font-weight: 700;
            letter-spacing: -1px;
            margin: 0;
            line-height: 1.2;
            color: var(--text-primary);
            text-shadow: 0 0 15px var(--accent-glow);
        }
        
        .subtitle {
            font-size: 1.2em;
            color: var(--text-secondary);
            margin-top: 0.5rem;
            font-weight: 400;
        }

        main {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .button-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1200px;
            width: 100%;
        }

        .button-container button {
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 18px 25px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            border-radius: 12px;
            position: relative;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            opacity: 0;
            
            /* Glassmorphism Effect */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            /* Transitions & Animation */
            transition: all 0.3s ease;
            animation: popIn 0.6s forwards cubic-bezier(0.25, 1, 0.5, 1);
        }

        .button-icon {
            width: 28px;
            height: 28px;
            margin-right: 15px;
            fill: var(--accent-color);
            transition: transform 0.3s ease;
        }

        .button-container button:hover {
            transform: translateY(-8px) scale(1.03);
            background: rgba(31, 41, 55, 0.8);
            border-color: var(--border-hover);
            box-shadow: 0 0 25px var(--accent-glow);
        }

        .button-container button:hover .button-icon {
            transform: scale(1.15) rotate(-5deg);
        }
        
        .button-container button.clicked {
            animation: clickEffect 0.4s ease;
        }

        /* Keyframe Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes popIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes clickEffect {
            0% { transform: translateY(-8px) scale(1.03); }
            50% { transform: translateY(0) scale(0.98); }
            100% { transform: translateY(-8px) scale(1.03); }
        }

        /* Responsive adjustments */
        @media (max-width: 1024px) {
            h1 { font-size: 3em; }
            .button-container { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
        }

        @media (max-width: 768px) {
            body { padding: 3rem 1.5rem; overflow-y: auto; }
            header { margin-bottom: 3rem; }
            h1 { font-size: 2.5em; }
            .subtitle { font-size: 1.1em; }
            .button-container { grid-template-columns: 1fr; max-width: 450px; }
            .button-container button { font-size: 1em; padding: 15px 20px; min-height: 70px; }
            .button-icon { width: 24px; height: 24px; }
        }

        @media (max-width: 480px) {
            body { padding: 2rem 1rem; }
            h1 { font-size: 2em; }
            header { margin-bottom: 2.5rem; }
            .button-container { gap: 20px; }
            .button-icon { margin-right: 12px; }
        }
    </style>
</head>
<body>

    <div class="background-container">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <header>
        <h1>BCA 4th Sem Hub</h1>
        <p class="subtitle">Navigate Your Academic Journey</p>
    </header>
    <main>
        <div class="button-container">
            <button data-link="English">
                <svg class="button-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
                 English
            </button>
            <button data-link="ComputerNetworks">
                <svg class="button-icon" viewBox="0 0 24 24"><path d="M20.2,15.2c-0.3-0.3-0.7-0.3-1,0L18,16.4V12c0-3.3-2.7-6-6-6s-6,2.7-6,6v4.4l-1.2-1.2c-0.3-0.3-0.7-0.3-1,0s-0.3,0.7,0,1l2.5,2.5c0.3,0.3,0.7,0.3,1,0l2.5-2.5c0.3-0.3,0.3-0.7,0-1s-0.7-0.3-1,0L14,16.4V12c0-2.2,1.8-4,4-4s4,1.8,4,4v4.4l-1.2-1.2c-0.3-0.3-0.7-0.3-1,0s-0.3,0.7,0,1l2.5,2.5c0.3,0.3,0.7,0.3,1,0l2.5-2.5c0.3-0.3,0.3-0.7,0-1C20.9,15.5,20.5,15.5,20.2,15.2z"/></svg>
                Computer Networks
            </button>
            <button data-link="ComputerOrientedNumericalAndStatisticalMethods">
                 <svg class="button-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 14H7v-2h10v2zm-4-4H7v-2h6v2zm4-4H7V7h10v2z"/></svg>
                Numerical & Statistical Methods
            </button>
            <button data-link="RelationalDatabaseManagementSystems">
                <svg class="button-icon" viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-3 9h-2.5v2.5h-3V11H8V9h2.5V6.5h3V9H16v2z"/></svg>
                 RDBMS
            </button>
            <button data-link="Punjabi">
                <svg class="button-icon" viewBox="0 0 24 24"><path d="M14.5 9.5c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM7.5 9.5c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9-2-2-.9-2-2-2zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14c-2.33 0-4.31-1.46-5.11-3.5h10.22c-.8 2.04-2.78 3.5-5.11-3.5z"/></svg>
                 Punjabi
            </button>
        </div>
    </main>

    <script>
        document.querySelectorAll('.button-container button').forEach((button, index) => {
            // Stagger the animation start time
            button.style.animationDelay = `${0.8 + index * 0.1}s`;

            button.addEventListener('click', (e) => {
                e.preventDefault(); // Prevent navigation until animation is done
                
                button.classList.add('clicked');
                const pageName = button.dataset.link;
                
                // Wait for the click animation to finish before navigating
                setTimeout(() => {
                    if (pageName) {
                         window.location.href = `${pageName}.html`;
                    }
                }, 400); // Duration of the clickEffect animation
            });
            
            // Reset the animation class so it can be triggered again
            button.addEventListener('animationend', (e) => {
                if(e.animationName === 'clickEffect') {
                    button.classList.remove('clicked');
                }
            });
        });
    </script>

</body>
</html>
