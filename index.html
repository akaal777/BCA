<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BCA Grand Line</title>
  <link rel="icon" type="image/jpeg" href="bca_logo.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
  <style>
    :root {
      /* --- One Piece Theme Variables (Defaults to Day Sea) --- */
      --bg-day-1: #6bb6ff; /* Sky Blue */
      --bg-day-2: #3d92ff; /* Ocean Blue */
      --bg-day-3: #2d7ce8; /* Deeper Ocean */

      --primary-glow-day: #ffc107; /* Sunny Gold */
      --primary-glow-rgb-day: 255, 193, 7;
      --secondary-glow-day: #e65100; /* Treasure Orange */
      --secondary-glow-rgb-day: 230, 81, 0;

      --text-color-day: #3a2e1d; /* Dark Wood Brown */
      --heading-color-day: #ffffff;

      --button-bg-day: rgba(245, 222, 179, 0.85); /* Parchment */
      --button-border-default-day: #8B4513; /* Saddle Brown */
      --button-hover-bg-day: rgba(255, 235, 205, 0.95); /* Lighter Parchment */
      --button-text-color-day: #5d4037; /* Dark Brown Text */

      /* Waves for Day Theme */
      --wave-color-1-day: rgba(255, 255, 255, 0.3);
      --wave-color-2-day: rgba(255, 255, 255, 0.2);
      --footer-wave-color-day: rgba(61, 146, 255, 0.6);

      /* Ship Colors Day */
      --ship-body-day: #A0522D; /* Sienna */
      --ship-inner-day: #D2691E; /* Chocolate */
      --ship-alt-body-day: #8B4513; /* Saddle Brown */
      --ship-alt-inner-day: #CD853F; /* Peru */

      /* --- Night Sea Theme Variables --- */
      --bg-night-1: #0a192f; /* Deep Navy */
      --bg-night-2: #172a46; /* Midnight Blue */
      --bg-night-3: #031021; /* Near Black */

      --primary-glow-night: #89cff0; /* Baby Blue (Moonlight) */
      --primary-glow-rgb-night: 137, 207, 240;
      --secondary-glow-night: #f0e68c; /* Khaki (Star Glow) */
      --secondary-glow-rgb-night: 240, 230, 140;

      --text-color-night: #c8d0e0;
      --heading-color-night: #ffffff;

      --button-bg-night: rgba(30, 45, 70, 0.7);
      --button-border-default-night: var(--primary-glow-night);
      --button-hover-bg-night: rgba(45, 60, 90, 0.9);
      --button-text-color-night: #e0eaff;

       /* Waves for Night Theme */
      --wave-color-1-night: rgba(137, 207, 240, 0.15);
      --wave-color-2-night: rgba(137, 207, 240, 0.1);
      --footer-wave-color-night: rgba(23, 42, 70, 0.7);


      /* Ship Colors Night */
      --ship-body-night: rgba(100, 80, 70, 0.7);
      --ship-inner-night: rgba(120, 100, 90, 0.85);
      --ship-alt-body-night: rgba(90, 70, 60, 0.65);
      --ship-alt-inner-night: rgba(110, 90, 80, 0.8);

      /* --- Current Theme Aliases (Default to Day) --- */
      --bg1: var(--bg-day-1);
      --bg2: var(--bg-day-2);
      --bg3: var(--bg-day-3);
      --primary-glow: var(--primary-glow-day);
      --primary-glow-rgb: var(--primary-glow-rgb-day);
      --secondary-glow: var(--secondary-glow-day);
      --secondary-glow-rgb: var(--secondary-glow-rgb-day);
      --text-color: var(--text-color-day);
      --heading-color: var(--heading-color-day);
      --button-bg: var(--button-bg-day);
      --button-border-default: var(--button-border-default-day);
      --button-hover-bg: var(--button-hover-bg-day);
      --button-text-color: var(--button-text-color-day);

      --wave-1: var(--wave-color-1-day);
      --wave-2: var(--wave-color-2-day);
      --footer-wave-color: var(--footer-wave-color-day);

      --ship-body: var(--ship-body-day);
      --ship-inner: var(--ship-inner-day);
      --ship-alt-body: var(--ship-alt-body-day);
      --ship-alt-inner: var(--ship-alt-inner-day);
    }

    body.night-theme {
      --bg1: var(--bg-night-1);
      --bg2: var(--bg-night-2);
      --bg3: var(--bg-night-3);
      --primary-glow: var(--primary-glow-night);
      --primary-glow-rgb: var(--primary-glow-rgb-night);
      --secondary-glow: var(--secondary-glow-night);
      --secondary-glow-rgb: var(--secondary-glow-rgb-night);
      --text-color: var(--text-color-night);
      --heading-color: var(--heading-color-night);
      --button-bg: var(--button-bg-night);
      --button-border-default: var(--button-border-default-night);
      --button-hover-bg: var(--button-hover-bg-night);
      --button-text-color: var(--button-text-color-night);

      --wave-1: var(--wave-color-1-night);
      --wave-2: var(--wave-color-2-night);
      --footer-wave-color: var(--footer-wave-color-night);

      --ship-body: var(--ship-body-night);
      --ship-inner: var(--ship-inner-night);
      --ship-alt-body: var(--ship-alt-body-night);
      --ship-alt-inner: var(--ship-alt-inner-night);
    }

    body {
      background: linear-gradient(-45deg,
        var(--bg1),
        var(--bg2),
        var(--bg3),
        var(--bg1)
      );
      background-size: 400% 400%;
      animation: oceanGradientBG 45s ease-in-out infinite;
      min-height: 100vh;
      margin: 0;
      padding-bottom: 150px; /* Increased padding to make space for footer */
      font-family: 'IM Fell English SC', serif;
      color: var(--text-color);
      overflow-x: hidden;
      position: relative;
      transition: background 0.5s ease, color 0.5s ease;
    }

    @keyframes oceanGradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body::before, body::after {
        content: "";
        position: fixed;
        left: 0;
        width: 200%;
        height: 100%;
        z-index: -2;
    }

    body::before {
        bottom: 15%; /* Position waves lower */
        background: radial-gradient(ellipse at center, var(--wave-1) 0%, transparent 70%);
        background-size: 600px 150px;
        animation: wave-animation-1 15s linear infinite;
        opacity: 0.8;
    }

    body::after {
        bottom: 12%;
        background: radial-gradient(ellipse at center, var(--wave-2) 0%, transparent 65%);
        background-size: 500px 120px;
        animation: wave-animation-2 12s linear infinite;
        z-index: -1;
        opacity: 0.9;
    }

    @keyframes wave-animation-1 {
        0% { transform: translateX(0) translateY(0) rotate(0deg); }
        50% { transform: translateX(-25%) translateY(10px) rotate(-2deg); }
        100% { transform: translateX(0) translateY(0) rotate(0deg); }
    }

    @keyframes wave-animation-2 {
        0% { transform: translateX(0) translateY(0) rotate(0deg); }
        50% { transform: translateX(-15%) translateY(-8px) rotate(2deg); }
        100% { transform: translateX(0) translateY(0) rotate(0deg); }
    }

    .ship-container {
      position: fixed;
      top: 60%; left: -150px; width: 120px; height: auto;
      z-index: 1; pointer-events: none;
      animation: sailShip 30s linear infinite 2s;
    }
    .ship-svg {
      width: 100%; height: auto;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    }
    .ship-svg .s1-body { fill: var(--ship-body); transition: fill 0.5s ease;}
    .ship-svg .s1-inner { fill: var(--ship-inner); transition: fill 0.5s ease;}


    .ship-container-alt {
      position: fixed;
      top: 25%; right: -180px; width: 150px; height: auto;
      z-index: 1; pointer-events: none;
      animation: sailShipAlt 45s linear infinite 10s;
    }
    .ship-svg-alt {
      width: 100%; height: auto; transform: scaleX(-1);
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
    }
    .ship-svg-alt .s2-body { fill: var(--ship-alt-body); transition: fill 0.5s ease;}
    .ship-svg-alt .s2-inner { fill: var(--ship-alt-inner); transition: fill 0.5s ease;}


    @keyframes sailShip {
      0% { transform: translateX(0) translateY(0) rotate(-2deg); }
      25% { transform: translateX(calc(50vw - 60px)) translateY(-15px) rotate(3deg); }
      50% { transform: translateX(calc(100vw + 150px)) translateY(5px) rotate(-1deg); }
      50.01% { transform: translateX(-150px) translateY(10px) rotate(-2deg); opacity: 0; }
      55% { opacity: 1; top: 62%; }
      100% { transform: translateX(calc(100vw + 150px)) translateY(0px) rotate(2deg); top: 62%;}
    }
    @keyframes sailShipAlt {
      0% { transform: translateX(0) translateY(0) rotate(2deg); }
      50% { transform: translateX(calc(-100vw - 180px)) translateY(-20px) rotate(-3deg); }
      100% { transform: translateX(0) translateY(0) rotate(2deg); }
    }

    header {
      text-align: center; padding: 50px 20px 25px; position: relative;
      animation: fadeInDown 1s ease-out 0.2s backwards; z-index: 2;
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      color: var(--heading-color); font-family: 'Pirata One', cursive;
      font-size: clamp(3rem, 1.5rem + 5vw, 6rem);
      margin: 15px 0; text-transform: uppercase;
      letter-spacing: clamp(2px, 1px + 0.5vw, 5px);
      text-shadow: 3px 3px 0px var(--secondary-glow), 6px 6px 0px rgba(0,0,0,0.2);
      transition: color 0.5s ease, text-shadow 0.5s ease;
    }

    main { position: relative; z-index: 2; }

    .button-container {
      display: flex; justify-content: center; gap: 30px;
      padding: 30px 20px; flex-wrap: wrap;
    }
    .cartoon-btn {
      background: var(--button-bg); color: var(--button-text-color);
      font-family: 'IM Fell English SC', serif; font-size: 1.3rem; font-weight: 700;
      padding: 18px 30px; border: 3px solid var(--button-border-default);
      border-radius: 8px; cursor: pointer;
      transition: all 0.3s ease, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                  background 0.5s ease, color 0.5s ease, border-color 0.5s ease;
      text-transform: uppercase; letter-spacing: 1.2px;
      position: relative; overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2), inset 0 -4px 5px rgba(0,0,0,0.1);
      min-width: 220px; animation: fadeInUp 0.6s ease-out backwards;
    }
    body.night-theme .cartoon-btn {
      box-shadow: 0 0 10px rgba(var(--primary-glow-rgb), 0.25), 0 0 20px rgba(var(--primary-glow-rgb), 0.1);
    }


    .button-container .cartoon-btn:nth-child(1) { animation-delay: 0.4s; }
    .button-container .cartoon-btn:nth-child(2) { animation-delay: 0.6s; }
    .button-container .cartoon-btn:nth-child(3) { animation-delay: 0.8s; }
    .button-container .cartoon-btn:nth-child(4) { animation-delay: 1.0s; }
    .button-container .cartoon-btn:nth-child(5) { animation-delay: 1.2s; }
    .button-container .cartoon-btn:nth-child(6) { animation-delay: 1.4s; }
    .button-container .cartoon-btn:nth-child(7) { animation-delay: 1.6s; }


    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    
    .cartoon-btn:hover {
      transform: translateY(-5px) scale(1.03); background: var(--button-hover-bg);
      border-color: var(--secondary-glow);
      box-shadow: 0 6px 10px rgba(0,0,0,0.3), 0 0 15px var(--secondary-glow);
    }
    body.night-theme .cartoon-btn:hover {
       box-shadow: 0 0 15px var(--secondary-glow), 0 0 30px var(--secondary-glow), inset 0 0 10px rgba(var(--secondary-glow-rgb), 0.15);
    }
   
    .theme-switcher {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      background-color: var(--button-bg);
      color: var(--button-text-color);
      border: 2px solid var(--button-border-default);
      padding: 8px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-family: 'IM Fell English SC', serif;
      font-size: 0.9rem;
      transition: background-color 0.3s, color 0.3s, border-color 0.3s;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .theme-switcher:hover {
      background-color: var(--button-hover-bg);
      border-color: var(--secondary-glow);
    }
    
    /* --- NEW: Footer Wave Animation --- */
    .footer {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 120px; /* Adjust height as needed */
        overflow: hidden;
        z-index: 0;
    }
    .waves {
        position: relative;
        width: 100%;
        height: 100%;
    }
    .wave-path {
        fill: var(--footer-wave-color);
        transition: fill 0.5s ease;
    }
    .parallax > use {
        animation: move-forever 25s cubic-bezier(.55,.5,.45,.5) infinite;
    }
    .parallax > use:nth-child(1) {
        animation-delay: -2s;
        animation-duration: 7s;
    }
    .parallax > use:nth-child(2) {
        animation-delay: -3s;
        animation-duration: 10s;
    }
    .parallax > use:nth-child(3) {
        animation-delay: -4s;
        animation-duration: 13s;
    }
    @keyframes move-forever {
        0% { transform: translate3d(-90px,0,0); }
        100% { transform: translate3d(85px,0,0); }
    }
    /* --- End of Footer Wave Animation --- */


    @media (max-width: 768px) {
      .cartoon-btn { font-size: 1.1rem !important; padding: 16px 22px !important; min-width: 190px; }
      .ship-container { width: 90px; }
      .ship-container-alt { width: 110px; animation-duration: 48s; }
      .theme-switcher { top: 15px; right: 15px; padding: 6px 12px; font-size: 0.8rem; }
    }

    @media (max-width: 480px) {
      h1 { font-size: clamp(2.5rem, 1.1rem + 4vw, 4rem); }
      /* --- MODIFIED: Bigger buttons and text for smartphones --- */
      .cartoon-btn { 
        font-size: 1.25rem !important; /* Increased text size */
        padding: 20px 25px !important; /* Increased padding for a larger button */
        min-width: calc(100% - 60px); 
        margin-bottom: 15px; 
      }
      .button-container { gap: 0; flex-direction: column; align-items: center; }
      .ship-container, .ship-container-alt { display: none; }
      body { animation-duration: 50s; }
      .theme-switcher { top: 10px; right: 10px; padding: 5px 10px; font-size: 0.75rem; }
    }
  </style>
</head>
<body>
  <button class="theme-switcher" id="themeSwitcher" aria-label="Toggle theme">
    ☀️ Day / 🌙 Night
  </button>

  <!-- Going Merry -->
  <div class="ship-container">
    <svg class="ship-svg" viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
      <path class="s1-body" d="M10 50 C 20 75, 80 75, 90 50 L 85 40 L 15 40 Z" fill="var(--ship-body)"/>
      <path d="M48 5 L 52 5 L 52 40 L 48 40 Z" fill="#654321"/> <!-- Mast -->
      <path class="s1-inner" d="M52 10 L 75 20 L 52 30 Z" fill="var(--ship-inner)"/> <!-- Sail -->
      <circle cx="20" cy="45" r="3" fill="#ffffff" stroke="#000000" stroke-width="1"/> <!-- Porthole -->
      <circle cx="75" cy="45" r="3" fill="#ffffff" stroke="#000000" stroke-width="1"/> <!-- Porthole -->
      <path d="M10 50 Q 5 45, 10 40" fill="none" stroke="#5d4037" stroke-width="2"/>
    </svg>
  </div>
  <!-- Thousand Sunny -->
  <div class="ship-container-alt">
    <svg class="ship-svg-alt" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
        <path class="s2-body" d="M10 70 C 20 100, 100 100, 110 70 L 115 50 L 5 50 Z" fill="var(--ship-alt-body)"/>
        <path d="M58 10 L 62 10 L 62 55 L 58 55 Z" fill="#5C4033"/> <!-- Main Mast -->
        <path class="s2-inner" d="M62 15 L 95 30 L 62 45 Z" fill="var(--ship-alt-inner)"/> <!-- Main Sail -->
        <path d="M100 50 L 110 60 L 105 70 L 95 60 Z" fill="#D2B48C"/> <!-- Upper Deck -->
        <circle cx="20" cy="55" r="4" fill="#ffffff" stroke="#000000" stroke-width="1"/>
        <circle cx="85" cy="55" r="4" fill="#ffffff" stroke="#000000" stroke-width="1"/>
        <path d="M 50, 50 m -10, 0 a 10,10 0 1,0 20,0 a 10,10 0 1,0 -20,0" fill="#ffc107"/> <!-- Sunny Head -->
        <path d="M45 48 L 55 48 M 48 52 L 52 52" stroke="#000" stroke-width="1"/>
    </svg>
  </div>

  <header>
    <h1>BCA 🎓</h1>
  </header>

  <main>
    <div class="button-container">
      <button class="cartoon-btn blue" id="semester3">Semester 3 📚</button>
      <button class="cartoon-btn yellow" id="semester4">Semester 4 ✨</button>
      <button class="cartoon-btn lime" id="semester5">Semester 5 🧑‍💻</button>
      <button class="cartoon-btn deep-orange" id="semester6">Semester 6 🚀</button>
      <button class="cartoon-btn cyan" id="datesheet">Datesheet 📅</button>
      <button class="cartoon-btn pink" id="result">Result 🎉</button>
      <button class="cartoon-btn gold" id="syllabus">Syllabus 🗺️</button>
    </div>
  </main>
  
  <!-- NEW: Added Footer with Wave SVG -->
  <footer class="footer">
    <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
    viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
      <defs>
        <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
      </defs>
      <g class="parallax">
        <use xlink:href="#gentle-wave" x="48" y="0" class="wave-path" opacity="0.7" />
        <use xlink:href="#gentle-wave" x="48" y="3" class="wave-path" opacity="0.5" />
        <use xlink:href="#gentle-wave" x="48" y="5" class="wave-path" opacity="0.3" />
      </g>
    </svg>
  </footer>


  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Button navigation
      document.getElementById('semester3').addEventListener('click', function() { window.location.href = "https://akaal777.github.io/B-C-A/"; });
      document.getElementById('semester4').addEventListener('click', function() { window.location.href = "sem4/semester4.html"; });
      document.getElementById('semester5').addEventListener('click', function() { window.location.href = "sem5/semester5.html"; });
      document.getElementById('semester6').addEventListener('click', function() { window.location.href = "sem6/semester6.html"; });
      document.getElementById('datesheet').addEventListener('click', function() { window.location.href = "https://ds19.pupexamination.ac.in/uploaddatesheet/view-datesheet.php"; });
      document.getElementById('result').addEventListener('click', function() { window.location.href = "https://results.pupexamination.ac.in/t8/results/results.php"; });
      document.getElementById('syllabus').addEventListener('click', function() { window.location.href = "http://www.punjabiuniversity.ac.in/indexSyllabi.aspx"; });

      // Theme Switcher Logic
      const themeSwitcher = document.getElementById('themeSwitcher');
      const body = document.body;
      const prefersDarkScheme = window.matchMedia("(prefers-color-scheme: dark)");

      function applyTheme(theme) {
        if (theme === 'night') {
          body.classList.add('night-theme');
          themeSwitcher.textContent = '☀️ Day';
        } else {
          body.classList.remove('night-theme');
          themeSwitcher.textContent = '🌙 Night';
        }
      }

      let currentTheme = localStorage.getItem('theme');
      if (currentTheme) {
        applyTheme(currentTheme);
      } else {
        // Default to night theme if user's system prefers dark, otherwise day
        applyTheme(prefersDarkScheme.matches ? 'night' : 'day');
      }

      themeSwitcher.addEventListener('click', () => {
        if (body.classList.contains('night-theme')) {
          currentTheme = 'day';
        } else {
          currentTheme = 'night';
        }
        localStorage.setItem('theme', currentTheme);
        applyTheme(currentTheme);
      });

      prefersDarkScheme.addEventListener('change', (e) => {
        // Only change if no theme is manually set
        if (!localStorage.getItem('theme')) {
            applyTheme(e.matches ? 'night' : 'light');
        }
      });
    });
  </script>
</body>
</html>
