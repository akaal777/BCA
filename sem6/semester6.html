<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCA 6th Semester - One Piece Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Noto+Sans:wght@400;700&display=swap');

        :root {
            /* --- Light Theme (Dawn Island) --- */
            --bg-image: url('https://i.imgur.com/example-light-bg.png'); /* Replace with a suitable light theme image */
            --bg-overlay: rgba(240, 230, 210, 0.85);
            --text-color: #4a4a4a;
            --header-bg: rgba(255, 248, 230, 0.8);
            --header-border: #d4ac79;
            --header-shadow: rgba(85, 42, 0, 0.2);
            --button-bg: #e6c593;
            --button-border: #b88a51;
            --button-text-color: #5d4037;
            --button-shadow: rgba(0, 0, 0, 0.15);
            --button-hover-bg: #d4ac79;
            --button-hover-border: #8c6d46;
            --button-hover-text-color: #ffffff;
            --accent-color-bca: #c0392b; /* Red inspired by Luffy's shirt */
            --accent-color-sem: #2980b9; /* Blue inspired by the sea */
            --theme-toggle-bg: #e6c593;
            --theme-toggle-icon: #5d4037;
            --theme-toggle-hover-bg: #d4ac79;

            /* --- Transition --- */
            --theme-transition-duration: 0.5s;
        }

        .dark-theme {
            /* --- Dark Theme (Laugh Tale) --- */
            --bg-image: url('https://i.imgur.com/example-dark-bg.png'); /* Replace with a suitable dark theme image */
            --bg-overlay: rgba(10, 25, 40, 0.9);
            --text-color: #e0e7ef;
            --header-bg: rgba(20, 35, 55, 0.85);
            --header-border: #f1c40f; /* Gold border */
            --header-shadow: rgba(241, 196, 15, 0.2);
            --button-bg: #4a4a4a;
            --button-border: #f1c40f;
            --button-text-color: #f1c40f;
            --button-shadow: rgba(241, 196, 15, 0.15);
            --button-hover-bg: #f1c40f;
            --button-hover-border: #f39c12;
            --button-hover-text-color: #0a1928;
            --accent-color-bca: #e74c3c;
            --accent-color-sem: #3498db;
            --theme-toggle-bg: #4a4a4a;
            --theme-toggle-icon: #f1c40f;
            --theme-toggle-hover-bg: #5a5a5a;
        }

        body {
            font-family: 'Noto Sans', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            background-color: #f0e6d2; /* Fallback color */
            color: var(--text-color);
            transition: color var(--theme-transition-duration) ease;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            animation: slowPan 60s linear infinite alternate;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-color: var(--bg-overlay);
            transition: background-color var(--theme-transition-duration) ease;
        }

        @keyframes slowPan {
            from { background-position: 0% 50%; }
            to { background-position: 100% 50%; }
        }

        .header-container {
            background-color: var(--header-bg);
            backdrop-filter: blur(5px);
            padding: 20px 40px;
            border-radius: 5px;
            border: 2px solid var(--header-border);
            box-shadow: 0 5px 20px var(--header-shadow), inset 0 0 15px rgba(0,0,0,0.1);
            margin-bottom: 50px;
            text-align: center;
            animation: fadeInFromTop 1s ease-out forwards;
            opacity: 0;
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 800px;
            transition: all var(--theme-transition-duration) ease;
        }

        .main-heading {
            font-family: 'IM Fell English SC', serif;
            font-size: 3em;
            margin: 0;
            font-weight: 400;
            letter-spacing: 2px;
        }

        .main-heading .bca-text { color: var(--accent-color-bca); transition: color var(--theme-transition-duration) ease; }
        .main-heading .sem-text { color: var(--accent-color-sem); transition: color var(--theme-transition-duration) ease; }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1000px;
            padding: 0 20px;
            box-sizing: border-box;
            position: relative;
            z-index: 1;
        }

        .subject-button {
            background-color: var(--button-bg);
            color: var(--button-text-color);
            padding: 25px 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.25em;
            font-weight: 700;
            cursor: pointer;
            border: 2px solid var(--button-border);
            box-shadow: 0 4px 8px var(--button-shadow);
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            animation: fadeInUp 0.6s ease-out forwards;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease,
                        background-color var(--theme-transition-duration) ease,
                        border-color var(--theme-transition-duration) ease,
                        color var(--theme-transition-duration) ease;
        }

        .subject-button:nth-child(1) { animation-delay: 0.3s; }
        .subject-button:nth-child(2) { animation-delay: 0.4s; }
        .subject-button:nth-child(3) { animation-delay: 0.5s; }
        .subject-button:nth-child(4) { animation-delay: 0.6s; }

        .subject-button:hover {
            transform: translateY(-8px) rotate(-1deg);
            background-color: var(--button-hover-bg);
            border-color: var(--button-hover-border);
            color: var(--button-hover-text-color);
            box-shadow: 0 12px 25px var(--button-shadow);
        }

        .theme-toggle-button {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: var(--theme-toggle-bg);
            color: var(--theme-toggle-icon);
            border: 2px solid var(--button-border);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            z-index: 1000;
            transition: all var(--theme-transition-duration) ease, transform 0.2s ease;
        }

        .theme-toggle-button:hover {
            background-color: var(--theme-toggle-hover-bg);
            transform: scale(1.1) rotate(15deg);
        }

        .theme-toggle-button .icon-sun { display: none; }
        .theme-toggle-button .icon-moon { display: inline; }

        @keyframes fadeInFromTop {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Responsive Adjustments --- */
        @media (max-width: 768px) {
            .main-heading { font-size: 2.2em; }
            .header-container { padding: 15px 25px; margin-bottom: 40px; width: 95%; }
            .subjects-grid { grid-template-columns: 1fr; gap: 20px; padding: 0 15px; }
            .subject-button { font-size: 1.15em; padding: 22px 15px; }
            .theme-toggle-button { width: 45px; height: 45px; font-size: 20px; }
        }

        @media (max-width: 480px) {
            body { padding: 15px; padding-top: 80px; }
            .main-heading { font-size: 1.8em; }
            .header-container { padding: 12px 15px; margin-bottom: 30px; }
            .subject-button { font-size: 1.1em; }
            .subjects-grid { padding: 0 10px; }
        }
    </style>
</head>
<body>

    <button id="theme-toggle" class="theme-toggle-button" aria-label="Toggle theme">
        <span class="icon-sun">🏴‍☠️</span> <!-- Straw Hat Jolly Roger for Dark Theme -->
        <span class="icon-moon">🧭</span> <!-- Compass for Light Theme -->
    </button>

    <div class="header-container">
        <h1 class="main-heading">
            <span class="bca-text">BCA</span> <span class="sem-text">6th Sem </span>
        </h1>
    </div>

    <div class="subjects-grid">
        <div class="subject-button" data-href="English Literary Skills -||.html">
            English Literary Skills -||
        </div>
        <div class="subject-button" data-href="Software Engineering.html">
            Software Engineering
        </div>
        <div class="subject-button" data-href="Operating Systems.html">
            Operating Systems
        </div>
        <div class="subject-button" data-href="Python Programming.html">
            Python Programming
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // --- Subject Button Navigation ---
            const subjectButtons = document.querySelectorAll('.subject-button');
            subjectButtons.forEach(button => {
                button.setAttribute('role', 'link');
                button.setAttribute('tabindex', '0');
                
                button.addEventListener('click', function() {
                    const targetFile = this.dataset.href;
                    if (targetFile) {
                        window.location.href = targetFile;
                    } else {
                        console.warn('No data-href attribute found for this button.');
                    }
                });

                button.addEventListener('keydown', function(event) {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        this.click();
                    }
                });
            });

            // --- Theme Toggle Functionality ---
            const themeToggleButton = document.getElementById('theme-toggle');
            const body = document.body;
            const sunIcon = themeToggleButton.querySelector('.icon-sun');
            const moonIcon = themeToggleButton.querySelector('.icon-moon');

            function applyTheme(theme) {
                if (theme === 'dark') {
                    body.classList.add('dark-theme');
                    sunIcon.style.display = 'inline';
                    moonIcon.style.display = 'none';
                    themeToggleButton.setAttribute('aria-label', 'Switch to light theme (Dawn Island)');
                } else {
                    body.classList.remove('dark-theme');
                    sunIcon.style.display = 'none';
                    moonIcon.style.display = 'inline';
                    themeToggleButton.setAttribute('aria-label', 'Switch to dark theme (Laugh Tale)');
                }
            }

            // Check for saved theme in localStorage, or default to system preference
            let currentTheme = localStorage.getItem('theme');
            if (!currentTheme) {
                currentTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            applyTheme(currentTheme);

            // Button click listener
            themeToggleButton.addEventListener('click', () => {
                let newTheme = body.classList.contains('dark-theme') ? 'light' : 'dark';
                applyTheme(newTheme);
                localStorage.setItem('theme', newTheme);
            });

            // Listen for changes in system preference
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
                // Only change if the user hasn't manually set a theme
                if (!localStorage.getItem('theme')) {
                    const newColorScheme = event.matches ? "dark" : "light";
                    applyTheme(newColorScheme);
                }
            });
        });
    </script>

</body>
</html>
