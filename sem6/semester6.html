<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCA 6th Semester | Curriculum Overview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* --- Modern Classy Theme --- */
            --bg-color: #1a1a1a;
            --card-color: #2b2b2b;
            --accent-gold: #c5a47e;
            --text-primary: #f5f5f5;
            --text-secondary: #a0a0a0;
            --border-color: rgba(197, 164, 126, 0.2);
            --font-primary: 'Poppins', sans-serif;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-primary);
            background-color: var(--bg-color);
            background-image: url('https://www.transparenttextures.com/patterns/subtle-carbon.png');
            color: var(--text-primary);
            line-height: 1.7;
            padding: 2rem;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .navigation-header {
            width: 100%;
            margin-bottom: 3rem;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.4s ease;
        }
        .back-button:hover {
            transform: translateY(-3px);
            color: var(--bg-color);
            background-color: var(--accent-gold);
            border-color: var(--accent-gold);
            box-shadow: 0 10px 25px rgba(197, 164, 126, 0.2);
        }

        .header-container {
            text-align: center;
            margin-bottom: 5rem;
            opacity: 0;
            animation: fadeInDown 1s 0.2s ease-out forwards;
        }

        .main-heading {
            font-size: clamp(2.8rem, 6vw, 4.5rem);
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -1px;
            margin: 0;
        }
        .main-heading span {
            color: var(--accent-gold);
        }

        .sub-heading {
            color: var(--text-secondary);
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            margin-top: 0.5rem;
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
            gap: 2rem;
        }

        .subject-button {
            background-color: var(--card-color);
            color: var(--text-primary);
            padding: 25px 20px;
            border-radius: 12px;
            text-align: center;
            font-size: 1.25em;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease;
            /* Initial state for scroll animation */
            opacity: 0;
            transform: translateY(40px);
        }
        .subject-button.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .subject-button:hover {
            transform: translateY(-8px);
            border-color: var(--accent-gold);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        /* --- Animations --- */
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Responsive Design --- */
        @media (max-width: 768px) { body { padding: 1.5rem; } }
        @media (max-width: 480px) { body { padding: 1rem; } .subjects-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="navigation-header">
             <a href="../index.html" class="back-button"><span>&larr;</span> Back to Dashboard</a>
        </div>

        <div class="header-container">
            <h1 class="main-heading">
                BCA <span>6th Semester</span>
            </h1>
            <p class="sub-heading">Final year subjects and resources.</p>
        </div>

        <div class="subjects-grid">
            <div class="subject-button" data-href="English Literary Skills -||.html">
                English Literary Skills - II
            </div>
            <div class="subject-button" data-href="Software Engineering.html">
                Software Engineering
            </div>
            <div class="subject-button" data-href="Operating Systems.html">
                Operating Systems
            </div>
            <div class="subject-button" data-href="Python Programming.html">
                Python Programming
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // --- Subject Button Navigation ---
            const subjectButtons = document.querySelectorAll('.subject-button');
            subjectButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const targetFile = this.dataset.href;
                    if (targetFile) window.location.href = targetFile;
                });
            });

            // --- Scroll Animation Logic ---
            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry, index) => {
                    if (entry.isIntersecting) {
                        // Apply a staggered delay for each button
                        entry.target.style.transition = `opacity 0.6s ease-out ${index * 0.1}s, transform 0.6s ease-out ${index * 0.1}s`;
                        entry.target.classList.add('is-visible');
                        observer.unobserve(entry.target); // Animate only once
                    }
                });
            }, {
                threshold: 0.1 // Trigger when 10% of the element is visible
            });

            // Observe all subject buttons for the animation
            document.querySelectorAll('.subject-button').forEach(button => {
                observer.observe(button);
            });
        });
    </script>
</body>
</html>
