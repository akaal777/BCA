<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCA 6th Semester | Premium Curriculum</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0a0a0c;
            --card-glass: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-gold: #e2b17a;
            --accent-gold-glow: rgba(226, 177, 122, 0.3);
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --font-main: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(226, 177, 122, 0.05) 0%, transparent 30%),
                radial-gradient(circle at 100% 100%, rgba(226, 177, 122, 0.05) 0%, transparent 30%);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            padding: 2rem 1rem;
            overflow-x: hidden;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* --- Navigation --- */
        .nav-bar {
            margin-bottom: 4rem;
            animation: fadeIn 0.8s ease-out;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--text-dim);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            padding: 8px 16px;
            border-radius: 12px;
            background: var(--card-glass);
            border: 1px solid var(--card-border);
        }

        .back-link:hover {
            color: var(--accent-gold);
            border-color: var(--accent-gold);
            transform: translateX(-5px);
        }

        /* --- Header --- */
        .header-section {
            text-align: center;
            margin-bottom: 5rem;
        }

        .badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(226, 177, 122, 0.1);
            color: var(--accent-gold);
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(226, 177, 122, 0.2);
            animation: fadeInDown 0.8s ease-out;
        }

        .title {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.1;
            margin-bottom: 1rem;
            animation: fadeInDown 0.8s ease-out 0.1s backwards;
        }

        .title span {
            background: linear-gradient(135deg, #fff 30%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
            animation: fadeInDown 0.8s ease-out 0.2s backwards;
        }

        /* --- Subject Grid --- */
        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .subject-card {
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: translateY(30px);
        }

        .subject-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .subject-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at top right, var(--accent-gold-glow), transparent 70%);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .subject-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent-gold);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 20px var(--accent-gold-glow);
        }

        .subject-card:hover::before {
            opacity: 1;
        }

        .icon-wrapper {
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.05);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 1.5rem;
            color: var(--accent-gold);
            transition: transform 0.5s ease;
        }

        .subject-card:hover .icon-wrapper {
            transform: scale(1.1) rotate(5deg);
            background: var(--accent-gold);
            color: var(--bg-dark);
        }

        .subject-name {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .view-btn {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }

        .subject-card:hover .view-btn {
            opacity: 1;
        }

        /* --- Animations --- */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* --- Responsive --- */
        @media (max-width: 768px) {
            body { padding: 1.5rem 1rem; }
            .header-section { margin-bottom: 3rem; }
            .subject-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <nav class="nav-bar">
            <a href="../index.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Dashboard
            </a>
        </nav>

        <header class="header-section">
            <span class="badge">Academic Session 2025-26</span>
            <h1 class="title">BCA <span>6th Semester</span></h1>
            <p class="subtitle">Complete curriculum, learning resources, and project guidelines for your final semester.</p>
        </header>

        <div class="subject-grid">
            <div class="subject-card" data-href="EnglishLiterary.html">
                <div class="icon-wrapper">
                    <i class="fas fa-book-open"></i>
                </div>
                <h3 class="subject-name">English Literary Skills</h3>
                <div class="view-btn">View Resources <i class="fas fa-chevron-right"></i></div>
            </div>

            <div class="subject-card" data-href="Software Engineering.html">
                <div class="icon-wrapper">
                    <i class="fas fa-project-diagram"></i>
                </div>
                <h3 class="subject-name">Software Engineering</h3>
                <div class="view-btn">View Resources <i class="fas fa-chevron-right"></i></div>
            </div>

            <div class="subject-card" data-href="Operating Systems.html">
                <div class="icon-wrapper">
                    <i class="fas fa-microchip"></i>
                </div>
                <h3 class="subject-name">Operating Systems</h3>
                <div class="view-btn">View Resources <i class="fas fa-chevron-right"></i></div>
            </div>

            <div class="subject-card" data-href="Python Programming.html">
                <div class="icon-wrapper">
                    <i class="fab fa-python"></i>
                </div>
                <h3 class="subject-name">Python Programming</h3>
                <div class="view-btn">View Resources <i class="fas fa-chevron-right"></i></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.subject-card');
            
            // Intersection Observer for scroll animations
            const observerOptions = {
                threshold: 0.1,
                rootMargin: '0px 0px -50px 0px'
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry, index) => {
                    if (entry.isIntersecting) {
                        // Add staggered delay based on index
                        setTimeout(() => {
                            entry.target.classList.add('visible');
                        }, index * 100);
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            cards.forEach(card => {
                observer.observe(card);
                
                // Click Navigation
                card.addEventListener('click', function() {
                    const url = this.getAttribute('data-href');
                    if (url) {
                        // Add a small exit transition before navigating
                        this.style.transform = 'scale(0.95)';
                        this.style.opacity = '0.8';
                        setTimeout(() => {
                            window.location.href = url;
                        }, 150);
                    }
                });
            });
        });
    </script>
</body>
</html>
