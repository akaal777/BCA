<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCA 5th Semester - One Piece Anime Adventure!</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <style>
        @import url('https://fonts.cdnfonts.com/css/one-piece');
        @import url('https://fonts.googleapis.com/css2?family=Bangers&display=swap');

        :root {
            /* --- One Piece Anime Theme Variables --- */
            --sky-blue: #00A8FF;
            --ocean-blue: #0059B3;
            --straw-hat-red: #D70000;
            --gold-yellow: #FFCE00;
            --wood-brown: #8B4513;
            --light-text: #FFFFFF;
            --dark-outline: #2c3e50;
            --wanted-paper: #f5eeda;
        }

        body {
            font-family: 'Bangers', cursive;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            background: linear-gradient(to bottom, var(--sky-blue), var(--ocean-blue));
            background-image: url('https://i.imgur.com/gO0aYyP.jpg'); /* Anime sea and sky background */
            background-size: cover;
            background-position: center center;
            animation: slow-pan 60s linear infinite alternate;
            color: var(--light-text);
        }

        .header-container {
            background-color: rgba(245, 238, 218, 0.85); /* Semi-transparent wanted paper */
            backdrop-filter: blur(4px);
            padding: 20px 40px;
            border-radius: 10px;
            border: 4px solid var(--wood-brown);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            margin-bottom: 50px;
            text-align: center;
            animation: bounceInDown 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards;
            opacity: 0;
            position: relative;
        }

        .main-heading {
            font-family: 'One Piece', sans-serif;
            font-size: 4em;
            margin: 0;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--straw-hat-red);
            -webkit-text-stroke: 2px var(--dark-outline);
            text-shadow: 4px 4px 0px var(--wood-brown);
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 35px;
            width: 100%;
            max-width: 1100px;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .subject-button {
            background-color: var(--gold-yellow);
            color: var(--dark-outline);
            padding: 25px 20px;
            border-radius: 15px;
            text-align: center;
            font-size: 1.8em;
            letter-spacing: 1px;
            font-weight: bold;
            cursor: pointer;
            border: 4px solid var(--dark-outline);
            box-shadow: inset 0 -6px 0 rgba(0,0,0,0.2), 0 6px 15px rgba(0,0,0,0.4);
            opacity: 0;
            animation: popIn 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards;
            transition: transform 0.2s ease-out, box-shadow 0.2s ease-out;
            position: relative;
        }

        .subject-button:nth-child(1) { animation-delay: 0.2s; }
        .subject-button:nth-child(2) { animation-delay: 0.3s; }
        .subject-button:nth-child(3) { animation-delay: 0.4s; }
        .subject-button:nth-child(4) { animation-delay: 0.5s; }

        .subject-button:active {
            transform: translateY(4px);
            box-shadow: inset 0 -2px 0 rgba(0,0,0,0.2), 0 2px 5px rgba(0,0,0,0.4);
        }

        @keyframes slow-pan {
            from { background-position: 0% center; }
            to { background-position: 100% center; }
        }

        @keyframes bounceInDown {
            from { opacity: 0; transform: translateY(-100px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        /* --- Responsive Adjustments --- */
        @media (max-width: 768px) {
            .main-heading {
                font-size: 3em;
                -webkit-text-stroke: 1.5px var(--dark-outline);
            }
            .header-container {
                padding: 15px 25px;
                margin-bottom: 40px;
            }
            .subjects-grid {
                grid-template-columns: 1fr;
                gap: 25px;
                padding: 0 15px;
            }
            .subject-button {
                font-size: 1.5em;
                padding: 20px 15px;
            }
        }

        @media (max-width: 480px) {
            body { padding: 15px; }
            .main-heading {
                font-size: 2.2em;
            }
            .header-container {
                padding: 12px 15px;
            }
            .subject-button {
                font-size: 1.3em;
            }
        }

    </style>
</head>
<body>
    <div class="header-container">
        <h1 class="main-heading">BCA Grand Line - 5th Sem</h1>
    </div>

    <div class="subjects-grid">
        <div class="subject-button" data-href="English Literary Skills.html">
            English Literary Skills
        </div>
        <div class="subject-button" data-href="System Analysis and Design.html">
           System Analysis and Design
        </div>
        <div class="subject-button" data-href="Java Programming.html">
           Java Programming
        </div>
        <div class="subject-button" data-href="Webdesigning.html">
           Webdesigning Using ASP.NET
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const buttons = document.querySelectorAll('.subject-button');

            buttons.forEach(button => {
                // Navigate on click
                button.addEventListener('click', function() {
                    const targetFile = this.dataset.href;
                    if (targetFile) {
                        window.location.href = targetFile;
                    }
                });

                // Fun hover animation
                button.addEventListener('mouseenter', () => {
                    anime({
                        targets: button,
                        rotate: [-5, 5, -3, 3, 0],
                        duration: 500,
                        easing: 'easeInOutSine'
                    });
                });
            });
        });
    </script>

</body>
</html>
