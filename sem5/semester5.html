<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCA 5th Semester - Modern Curriculum</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <style>
        :root {
            /* --- Modern & Clean Theme --- */
            --bg-start: #f4f7f6;
            --bg-end: #d5e1e6;
            --primary-accent: #0077b6;
            --secondary-accent: #00b4d8;
            --text-color: #333;
            --heading-color: #111;
            --subheading-color: #555;
            --card-bg: rgba(255, 255, 255, 0.65);
            --card-shadow: rgba(0, 0, 0, 0.08);
            --card-border: rgba(255, 255, 255, 0.8);
            --hover-shadow: rgba(0, 119, 182, 0.2);
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            color: var(--text-color);
        }

        /* Animated Gradient Background Blobs */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            z-index: -1;
            filter: blur(90px);
            opacity: 0.7;
        }

        body::before {
            top: 5vh;
            left: -10vw;
            width: 40vmax;
            height: 40vmax;
            background: radial-gradient(circle, var(--secondary-accent) 0%, rgba(0,180,216,0) 70%);
            animation: move-blob-1 20s infinite alternate ease-in-out;
        }

        body::after {
            bottom: 5vh;
            right: -10vw;
            width: 40vmax;
            height: 40vmax;
            background: radial-gradient(circle, var(--primary-accent) 0%, rgba(0,119,182,0) 70%);
            animation: move-blob-2 25s infinite alternate ease-in-out;
        }

        @keyframes move-blob-1 {
            from { transform: translate(0, 0) scale(1) rotate(0deg); }
            to { transform: translate(15vw, 10vh) scale(1.2) rotate(45deg); }
        }

        @keyframes move-blob-2 {
            from { transform: translate(0, 0) scale(1.2) rotate(45deg); }
            to { transform: translate(-15vw, -10vh) scale(1) rotate(0deg); }
        }

        .back-button {
            position: absolute;
            top: 2rem;
            left: 2rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 0.75rem 1.25rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 4px 15px var(--card-shadow);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px var(--hover-shadow);
            background: white;
        }

        .header-container {
            text-align: center;
            margin-bottom: 3rem;
            animation: slideInDown 0.8s ease-out forwards;
            padding-top: 4rem; /* Make space for back button */
        }

        .main-heading {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 700;
            color: var(--heading-color);
            margin: 0;
        }

        .sub-heading {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: var(--subheading-color);
            margin-top: 0.5rem;
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 1200px;
        }

        .subject-card {
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 2.5rem 2rem;
            border-radius: 20px;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--card-border);
            box-shadow: 0 8px 32px 0 var(--card-shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.6s ease-out forwards;
            position: relative;
            overflow: hidden;
        }

        .subject-card-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary-accent);
            transition: transform 0.4s ease;
        }

        .subject-card:hover .subject-card-icon {
            transform: scale(1.2) rotate(10deg);
        }

        /* Staggered animation */
        .subject-card:nth-child(1) { animation-delay: 0.2s; }
        .subject-card:nth-child(2) { animation-delay: 0.3s; }
        .subject-card:nth-child(3) { animation-delay: 0.4s; }
        .subject-card:nth-child(4) { animation-delay: 0.5s; }

        .subject-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 16px 45px 0 var(--hover-shadow);
        }

        .subject-card:active {
            transform: translateY(-5px) scale(0.98);
            box-shadow: 0 8px 32px 0 var(--hover-shadow);
        }

        @keyframes slideInDown {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Responsive Adjustments --- */
        @media (max-width: 768px) {
            body { padding: 1.5rem; }
            .subjects-grid { grid-template-columns: 1fr; gap: 1.5rem; }
            .header-container { padding-top: 5rem; }
            .back-button { top: 1.5rem; left: 1.5rem; }
        }

        @media (max-width: 480px) {
            body { padding: 1rem; }
            .header-container { padding-top: 4rem; margin-bottom: 2rem; }
            .back-button {
                top: 1rem;
                left: 1rem;
                padding: 0.6rem 1rem;
                font-size: 0.9rem;
            }
            .main-heading { font-size: 2rem; }
            .sub-heading { font-size: 0.9rem; }
            .subject-card { padding: 2rem 1.5rem; font-size: 1.1rem; }
        }

    </style>
</head>
<body>
    <a href="../index.html" class="back-button">
        <span>&larr;</span> Back
    </a>

    <header class="header-container">
        <h1 class="main-heading">BCA 5th Semester</h1>
        <p class="sub-heading">Select a subject to view resources and notes.</p>
    </header>

    <main class="subjects-grid">
        <div class="subject-card" data-href="English Literary Skills.html">
            <div class="subject-card-icon">📚</div>
            English Literary Skills
        </div>
        <div class="subject-card" data-href="System Analysis and Design.html">
            <div class="subject-card-icon">⚙️</div>
           System Analysis and Design
        </div>
        <div class="subject-card" data-href="Java Programming.html">
            <div class="subject-card-icon">💻</div>
           Java Programming
        </div>
        <div class="subject-card" data-href="Webdesigning.html">
            <div class="subject-card-icon">🌐</div>
           Webdesigning Using ASP.NET
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const cards = document.querySelectorAll('.subject-card');

            cards.forEach(card => {
                // Navigate on click
                card.addEventListener('click', function() {
                    const targetFile = this.dataset.href;
                    if (targetFile) {
                        window.location.href = targetFile;
                    }
                });

                // Tilt effect on hover
                card.addEventListener('mousemove', (e) => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;

                    const rotateX = (y / rect.height - 0.5) * -10; // Reduced rotation
                    const rotateY = (x / rect.width - 0.5) * 10;

                    // Apply a smooth transition for the transform
                    card.style.transition = 'transform 0.1s linear';
                    card.style.transform = `perspective(1500px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-10px)`;
                });

                card.addEventListener('mouseleave', () => {
                    // Reset transform with a smooth animation
                    card.style.transition = 'transform 0.5s ease';
                    card.style.transform = `perspective(1500px) rotateX(0) rotateY(0) translateY(-10px)`;
                });
            });
        });
    </script>

</body>
</html>
