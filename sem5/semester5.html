<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCA 5th Semester | Premium Curriculum</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0a0a0c;
            --card-glass: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-gold: #e2b17a;
            --accent-gold-glow: rgba(226, 177, 122, 0.3);
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --font-main: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(226, 177, 122, 0.07) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(226, 177, 122, 0.07) 0%, transparent 40%);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            padding: 2rem 1rem;
            overflow-x: hidden;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* --- Navigation --- */
        .nav-bar {
            margin-bottom: 4rem;
            animation: fadeIn 0.8s ease-out;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--text-dim);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            padding: 10px 20px;
            border-radius: 14px;
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(5px);
        }

        .back-link:hover {
            color: var(--accent-gold);
            border-color: var(--accent-gold);
            transform: translateX(-5px);
            box-shadow: 0 0 15px var(--accent-gold-glow);
        }

        /* --- Header --- */
        .header-section {
            text-align: center;
            margin-bottom: 5rem;
        }

        .badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(226, 177, 122, 0.1);
            color: var(--accent-gold);
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(226, 177, 122, 0.2);
            animation: fadeInDown 0.8s ease-out;
        }

        .title {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.1;
            margin-bottom: 1rem;
            animation: fadeInDown 0.8s ease-out 0.1s backwards;
        }

        .title span {
            background: linear-gradient(135deg, #fff 30%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
            animation: fadeInDown 0.8s ease-out 0.2s backwards;
        }

        /* --- Subject Grid --- */
        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
        }

        .subject-card {
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 45px 30px;
            text-align: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            backdrop-filter: blur(12px);
            opacity: 0;
            transform: translateY(30px);
        }

        .subject-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .subject-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top right, var(--accent-gold-glow), transparent 60%);
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 0;
        }

        .subject-card:hover {
            transform: translateY(-12px);
            border-color: var(--accent-gold);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 15px rgba(226, 177, 122, 0.15);
        }

        .subject-card:hover::after {
            opacity: 1;
        }

        .content-container {
            position: relative;
            z-index: 1;
        }

        .icon-wrapper {
            width: 70px;
            height: 70px;
            background: rgba(255,255,255,0.04);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 28px;
            font-size: 1.8rem;
            color: var(--accent-gold);
            transition: all 0.5s ease;
            border: 1px solid var(--card-border);
        }

        .subject-card:hover .icon-wrapper {
            transform: scale(1.1) rotate(8deg);
            background: var(--accent-gold);
            color: var(--bg-dark);
            box-shadow: 0 10px 20px rgba(226, 177, 122, 0.3);
        }

        .subject-name {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--text-main);
            letter-spacing: -0.3px;
        }

        .view-btn {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            opacity: 0.5;
            transition: all 0.3s ease;
        }

        .subject-card:hover .view-btn {
            opacity: 1;
            gap: 15px;
        }

        /* --- Animations --- */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* --- Responsive Design --- */
        @media (max-width: 768px) {
            body { padding: 1.5rem 1rem; }
            .header-section { margin-bottom: 3rem; }
            .subject-grid { grid-template-columns: 1fr; }
            .title { font-size: 2.8rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <nav class="nav-bar">
            <a href="../index.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Dashboard
            </a>
        </nav>

        <header class="header-section">
            <h1 class="title">BCA <span>5th Semester</span></h1>
            <p class="subtitle">Curated resources, system design documentation, and advanced programming modules.</p>
        </header>

        <div class="subject-grid">
            <div class="subject-card" data-href="English Literary Skills.html">
                <div class="content-container">
                    <div class="icon-wrapper">
                        <i class="fas fa-book-open"></i>
                    </div>
                    <h3 class="subject-name">English Literary Skills</h3>
                    <div class="view-btn">Explore Notes <i class="fas fa-chevron-right"></i></div>
                </div>
            </div>

            <div class="subject-card" data-href="System Analysis and Design.html">
                <div class="content-container">
                    <div class="icon-wrapper">
                        <i class="fas fa-diagram-project"></i>
                    </div>
                    <h3 class="subject-name">System Analysis & Design</h3>
                    <div class="view-btn">Explore Notes <i class="fas fa-chevron-right"></i></div>
                </div>
            </div>

            <div class="subject-card" data-href="Java Programming.html">
                <div class="content-container">
                    <div class="icon-wrapper">
                        <i class="fab fa-java"></i>
                    </div>
                    <h3 class="subject-name">Java Programming</h3>
                    <div class="view-btn">Explore Notes <i class="fas fa-chevron-right"></i></div>
                </div>
            </div>

            <div class="subject-card" data-href="Webdesigning.html">
                <div class="content-container">
                    <div class="icon-wrapper">
                        <i class="fas fa-code"></i>
                    </div>
                    <h3 class="subject-name">ASP.NET Web Design</h3>
                    <div class="view-btn">Explore Notes <i class="fas fa-chevron-right"></i></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.subject-card');
            
            // Intersection Observer for scroll-in animations
            const observerOptions = {
                threshold: 0.1,
                rootMargin: '0px 0px -50px 0px'
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry, index) => {
                    if (entry.isIntersecting) {
                        // Staggered reveal effect
                        setTimeout(() => {
                            entry.target.classList.add('visible');
                        }, index * 120);
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            cards.forEach(card => {
                observer.observe(card);
                
                // Click Navigation with smooth feedback
                card.addEventListener('click', function() {
                    const url = this.getAttribute('data-href');
                    if (url) {
                        this.style.transform = 'scale(0.96) translateY(-5px)';
                        this.style.filter = 'brightness(1.2)';
                        setTimeout(() => {
                            window.location.href = url;
                        }, 200);
                    }
                });
            });
        });
    </script>
</body>
</html>
