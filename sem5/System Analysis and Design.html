<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Piece Learning Adventure</title>
    <style>
        /* One Piece & Anime Theme CSS */
        @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Roboto:wght@400;700&display=swap');

        /* Define Anime Keyframe Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes buttonPulse {
            0% { transform: scale(1); box-shadow: 0 4px 15px rgba(255, 223, 0, 0.3); }
            50% { transform: scale(1.05); box-shadow: 0 6px 25px rgba(255, 223, 0, 0.7); }
            100% { transform: scale(1); box-shadow: 0 4px 15px rgba(255, 223, 0, 0.3); }
        }

        @keyframes sectionGlow {
            from { box-shadow: 0 0 15px rgba(255, 215, 0, 0.2); border-color: #8B4513; }
            to { box-shadow: 0 0 30px rgba(255, 215, 0, 0.6); border-color: #FFD700; }
        }

        body {
            font-family: 'Roboto', sans-serif;
            /* One Piece themed background image - The Thousand Sunny */
            background: url('https://images.alphacoders.com/133/1330229.jpeg') no-repeat center center fixed;
            background-size: cover;
            color: #f0f0f0; /* Off-white for readability */
            margin: 0;
            padding: 0;
            line-height: 1.7;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Deep sea blue overlay, reminiscent of the Grand Line */
            background-color: rgba(13, 37, 63, 0.75);
            z-index: -1;
        }

        .container {
            width: 85%;
            margin: 30px auto;
            /* Ship's wood/treasure chest theme */
            background-color: rgba(50, 30, 20, 0.85);
            padding: 40px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            border: 2px solid #8B4513; /* Saddle Brown - for a wood feel */
            backdrop-filter: blur(8px);
            animation: fadeIn 1s ease-in-out;
        }

        h1 {
            text-align: center;
            /* Pirate/Adventure themed font */
            font-family: 'IM Fell English SC', serif;
            color: #FFD700; /* Gold - for treasure */
            margin-bottom: 40px;
            text-shadow: 3px 3px 10px #000;
            font-size: 3em;
            letter-spacing: 2.5px;
        }

        section {
            margin-bottom: 40px;
            padding: 30px;
            border: 1px solid #8B4513; /* Wood border */
            border-radius: 12px;
            background-color: rgba(81, 48, 32, 0.7);
            transition: all 0.4s ease;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
        }

        section:hover {
            transform: translateY(-5px);
            animation: sectionGlow 0.8s infinite alternate;
        }

        section h2 {
            margin-top: 0;
            font-family: 'IM Fell English SC', serif;
            color: #DC143C; /* Crimson - Luffy's shirt color */
            border-bottom: 2px solid #8B4513;
            padding-bottom: 12px;
            font-size: 2.2em;
            text-shadow: 2px 2px 6px #000;
        }

        button {
            background-color: #005A9C; /* Strong Blue - representing the sea/marines */
            color: #fff;
            padding: 14px 28px;
            border: 2px solid #FFD700; /* Gold border */
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            font-family: 'IM Fell English SC', serif;
            font-size: 1.2em;
            letter-spacing: 1px;
            outline: none;
            margin: 5px;
            text-transform: uppercase;
        }

        button:hover {
            background-color: #DC143C; /* Crimson on hover */
            border-color: #fff;
            transform: translateY(-3px);
            animation: buttonPulse 1s infinite;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                width: 95%;
                padding: 30px;
            }

            h1 {
                font-size: 2.5em;
            }
             section h2 {
                font-size: 1.8em;
            }

            button {
                width: 100%;
                margin-bottom: 10px;
            }
        }

        @media (max-width: 576px) {
            .container {
                width: 98%;
                padding: 20px;
                margin: 15px auto;
                text-align: center;
            }

            h1 {
                font-size: 2.2em;
                margin-bottom: 30px;
            }

            section {
                padding: 20px;
                margin-bottom: 30px;
            }

            section h2 {
                font-size: 1.6em;
                padding-bottom: 8px;
            }
            
            #theory-links, #pdf-links, #video-links {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            button {
                padding: 12px 20px;
                font-size: 1em;
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>System Analysis and Design</h1>

        <section id="theory-section">
            <h2>Logbook (Theory)</h2>
            <div id="theory-links"></div>
        </section>

        <section id="pdf-section">
            <h2>Treasure Maps (PDFs)</h2>
            <div id="pdf-links"></div>
        </section>

        <section id="video-section">
            <h2>Adventures (Videos)</h2>
            <div id="video-links"></div>
        </section>
    </div>

    <script>
        // Data (No changes needed here)
        const theoryLinks = [
            { text: "Basics Of SAD", url: "https://www.codershelpline.com/courses/theorypapers/system-analysis-design/basics-of-sad/" },
            { text: "geeksforgeeks", url: "https://www.geeksforgeeks.org/system-design/system-analysis-system-design/" },
            { text:"tutorialspoint",url:"https://www.tutorialspoint.com/system_analysis_and_design/system_analysis_and_design_overview.htm"}
        ];

        const pdfLinks = [
            { text: "SAD 9th Edition", url: "https://ia600408.us.archive.org/31/items/system-analysis-and-design-9th-edition/System_Analysis_and_Design_9e_Shelly_Cas.pdf" },
            { text: "sad Notes", url: "https://www.nielit.gov.in/shimla/sites/default/files/Shimla/UNIT1.pdf" },
            {  text :"System analysis and Design",url:"https://drive.google.com/file/d/1PccnshAn1CFpi-PQPSDT4rE_vC32xGfk/view"},
            { text :"SAD pdf",url:"https://www.bcanotes.com/Download/sad/System%20Analysis%20And%20Design/System%20Analysis%20and%20Design.pdf"}
        ];

        const videoLinks = [
            { text: "System analysis and Design in Hindi", url: "https://youtube.com/playlist?list=PLi81x6d2Os_8Sa8HifiFruWK6wmgG3Wrg&si=rI-aVsuqSpZOk7OE" },
            { text: "System analysis and Design One Shot ", url: "https://www.youtube.com/live/aZ33oo0l6xU?si=R-ClHe1G9NmCBrb_" }
        ];

        // Functions to create buttons
        function createButton(text, url) {
            const button = document.createElement("button");
            button.textContent = text;
            button.onclick = function() {
                window.open(url, "_blank");
            };
            return button;
        }

        // Add links to Theory section
        const theorySection = document.getElementById("theory-links");
        theoryLinks.forEach(link => {
            theorySection.appendChild(createButton(link.text, link.url));
        });

        // Add links to PDF section
        const pdfSection = document.getElementById("pdf-links");
        pdfLinks.forEach(link => {
            pdfSection.appendChild(createButton(link.text, link.url));
        });

        // Add links to Video section
        const videoSection = document.getElementById("video-links");
        videoLinks.forEach(link => {
            videoSection.appendChild(createButton(link.text, link.url));
        });
    </script>
</body>
</html>
