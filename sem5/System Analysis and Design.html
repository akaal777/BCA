☺️<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Analysis and Design | Modern Resource Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* --- Modern Classy Theme --- */
            --bg-color: #1a1a1a;
            --card-color: #2b2b2b;
            --accent-gold: #c5a47e;
            --text-primary: #f5f5f5;
            --text-secondary: #a0a0a0;
            --border-color: rgba(197, 164, 126, 0.2);
            --font-primary: 'Poppins', sans-serif;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-primary);
            background-color: var(--bg-color);
            background-image: url('https://www.transparenttextures.com/patterns/subtle-carbon.png'); /* Subtle, classy texture */
            color: var(--text-primary);
            line-height: 1.7;
            padding: 2rem;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.4s ease;
            margin-bottom: 3rem;
        }
        .back-button:hover {
            transform: translateY(-3px);
            color: var(--bg-color);
            background-color: var(--accent-gold);
            border-color: var(--accent-gold);
            box-shadow: 0 10px 25px rgba(197, 164, 126, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 5rem;
            opacity: 0;
            animation: fadeInDown 1s 0.2s ease-out forwards;
        }

        .main-heading {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -1px;
        }
        .main-heading span {
            color: var(--accent-gold);
        }

        /* --- Section Styling with Scroll Animation --- */
        .content-section {
            margin-bottom: 3.5rem;
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: clamp(2rem, 5vw, 3rem);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            /* Initial state for animation */
            opacity: 0;
            transform: translateY(50px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        .content-section.is-visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .section-heading {
            font-size: clamp(2rem, 4vw, 2.5rem);
            font-weight: 700;
            margin-bottom: 2.5rem;
            padding-bottom: 1rem;
            position: relative;
            color: var(--text-primary);
        }
        .section-heading::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60px;
            height: 3px;
            border-radius: 2px;
            background: var(--accent-gold);
        }

        .links-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
        }
        
        button.resource-link {
            background-color: transparent;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 1rem;
            padding: 12px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s ease;
            font-family: var(--font-primary);
        }

        button.resource-link:hover {
            background-color: var(--accent-gold);
            border-color: var(--accent-gold);
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(197, 164, 126, 0.2);
        }

        /* --- Animations --- */
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        
        /* --- Responsive Design --- */
        @media (max-width: 768px) { body { padding: 1.5rem; } }
        @media (max-width: 480px) { body { padding: 1rem; } .links-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <a href="../sem5/semester5.html" class="back-button"><span>&larr;</span> Back to Semester 5</a>
        
        <header class="header">
            <h1 class="main-heading">System Analysis and <span>Design</span></h1>
        </header>

        <section id="theory-section" class="content-section">
            <h2 class="section-heading">Theory Resources</h2>
            <div class="links-container" id="theory-links"></div>
        </section>

        <section id="pdf-section" class="content-section">
            <h2 class="section-heading">Downloadable PDFs</h2>
            <div class="links-container" id="pdf-links"></div>
        </section>

        <section id="video-section" class="content-section">
            <h2 class="section-heading">Video Guides</h2>
            <div class="links-container" id="video-links"></div>
        </section>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Data remains the same
            const theoryLinks = [
                { text: "Basics Of SAD", url: "https://www.codershelpline.com/courses/theorypapers/system-analysis-design/basics-of-sad/" },
                { text: "GeeksForGeeks Guide", url: "https://www.geeksforgeeks.org/system-design/system-analysis-system-design/" },
                { text: "TutorialsPoint Overview", url: "https://www.tutorialspoint.com/system_analysis_and_design/system_analysis_and_design_overview.htm"}
            ];

            const pdfLinks = [
                { text: "SAD 9th Edition", url: "https://ia600408.us.archive.org/31/items/system-analysis-and-design-9th-edition/System_Analysis_and_Design_9e_Shelly_Cas.pdf" },
                { text: " SAD Notes", url: "https://www.nielit.gov.in/shimla/sites/default/files/Shimla/UNIT1.pdf" },
                { text: "SAD Lecture Notes", url: "https://drive.google.com/file/d/1PccnshAn1CFpi-PQPSDT4rE_vC32xGfk/view"},
                { text: "SAD Notes PDF", url: "https://www.bcanotes.com/Download/sad/System%20Analysis%20And%20Design/System%20Analysis%20and%20Design.pdf"},

                { text: "System Analysis Book Full PDF", url: "System-Analysis-and-Design-Tutorial.pdf" }
            ];

            const videoLinks = [
                { text: "Playlist in Hindi", url: "https://youtube.com/playlist?list=PLi81x6d2Os_8Sa8HifiFruWK6wmgG3Wrg&si=rI-aVsuqSpZOk7OE" },
                { text: "One Shot Video Guide", url: "https://www.youtube.com/live/aZ33oo0l6xU?si=R-ClHe1G9NmCBrb_" }
            ];

            // Function to create and append buttons
            function populateLinks(containerId, links) {
                const container = document.getElementById(containerId);
                links.forEach(link => {
                    const button = document.createElement("button");
                    button.textContent = link.text;
                    button.className = 'resource-link'; // Added class for styling
                    button.onclick = () => window.open(link.url, "_blank");
                    container.appendChild(button);
                });
            }

            // Populate all sections
            populateLinks("theory-links", theoryLinks);
            populateLinks("pdf-links", pdfLinks);
            populateLinks("video-links", videoLinks);

            // --- Scroll Animation Logic ---
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        // Optional: unobserve after first animation
                        // observer.unobserve(entry.target);
                    }
                });
            }, {
                threshold: 0.1 // Trigger when 10% of the element is visible
            });

            // Observe all content sections for the animation
            document.querySelectorAll('.content-section').forEach(section => {
                observer.observe(section);
            });
        });
    </script>
</body>
</html>
