<!DOCTYPE html>
<html>
<head>
<title>One Piece Adventure Hub</title>
<style>
    /* One Piece Anime Theme */
    @import url('https://fonts.googleapis.com/css2?family=Pirata+One&display=swap');

    body {
        font-family: 'Pirata One', cursive;
        background-color: #000;
        color: #fff;
        margin: 0;
        padding: 0;
        line-height: 1.7;
        overflow-x: hidden; /* Prevent horizontal scrollbar */
        background-image: url('https://i.pinimg.com/originals/e7/52/50/e75250ff6d7a8d2987a840e788975a5e.gif');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
    }

    .container {
        width: 90%;
        margin: 20px auto;
        background-color: rgba(0, 0, 0, 0.7);
        padding: 30px;
        box-shadow: 0 0 30px rgba(255, 223, 0, 0.5);
        border-radius: 15px;
        border: 3px solid #ffdf00;
    }

    h1 {
        text-align: center;
        color: #ffdf00;
        margin-bottom: 30px;
        text-shadow: 0 0 10px #ffdf00, 0 0 20px #ff4500;
        font-size: 3em;
        letter-spacing: 2px;
        animation: fire-text 2s infinite alternate;
    }

    @keyframes fire-text {
        from {
            text-shadow: 0 0 10px #ffdf00, 0 0 20px #ff4500;
        }
        to {
            text-shadow: 0 0 20px #ffdf00, 0 0 30px #ff4500, 0 0 40px #ff6347;
        }
    }

    section {
        margin-bottom: 30px;
        padding: 25px;
        border: 2px solid #8b4513;
        border-radius: 12px;
        background-color: rgba(139, 69, 19, 0.3);
        transition: all 0.4s ease;
        box-shadow: 0 0 15px rgba(255, 223, 0, 0.2);
    }

    section:hover {
        box-shadow: 0 0 25px rgba(255, 223, 0, 0.7);
        transform: translateY(-5px);
    }

    section h2 {
        margin-top: 0;
        color: #ffdf00;
        border-bottom: 2px solid #ffdf00;
        padding-bottom: 10px;
        font-size: 2em;
        text-shadow: 0 0 5px #ff4500;
    }

    button {
        background-color: #d2691e;
        color: #fff;
        padding: 14px 28px;
        border: 2px solid #8b4513;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.4s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        font-size: 1.3em;
        letter-spacing: 1.5px;
        outline: none;
        margin: 5px;
        font-family: 'Pirata One', cursive;
    }

    button:hover {
        background-color: #8b4513;
        transform: scale(1.1);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.7);
        animation: stretch-and-rebound 0.5s ease;
    }

    @keyframes stretch-and-rebound {
        0% {
            transform: scale(1.1) translateX(0);
        }
        25% {
            transform: scale(1.2) translateX(-5px);
        }
        50% {
            transform: scale(1.1) translateX(5px);
        }
        75% {
            transform: scale(1.2) translateX(-5px);
        }
        100% {
            transform: scale(1.1) translateX(0);
        }
    }

    #video-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
    }

    iframe {
        margin: 10px;
        border: 3px solid #ffdf00;
        box-shadow: 0 0 20px rgba(255, 223, 0, 0.5);
        border-radius: 12px;
        width: 100%;
        height: 250px;
        max-width: 100%;
        transition: all 0.4s ease;
    }

    iframe:hover {
        box-shadow: 0 0 35px rgba(255, 223, 0, 0.8);
        transform: scale(1.05);
    }

    /* Responsive Design */
    @media (max-width: 768px) {
        .container {
            width: 95%;
            padding: 20px;
        }

        h1 {
            font-size: 2.5em;
        }

        section {
            padding: 15px;
        }

        iframe {
            height: 200px;
        }

        button {
            font-size: 1.2em;
            padding: 12px 24px;
        }
    }

    @media (max-width: 576px) {
        body {
            font-size: 16px;
        }
        
        .container {
            width: 98%;
            margin: 10px auto;
            padding: 15px;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 25px;
        }

        section h2 {
            font-size: 1.7em;
            padding-bottom: 8px;
        }

        button {
            font-size: 1.2em;
            padding: 14px 28px;
            width: 100%; /* Full width buttons for better touch targets */
        }

        #video-container {
            gap: 10px;
        }

        iframe {
            height: 150px;
        }
    }

    /* Targeting specific screen size */
    @media (width: 400px) and (height: 900px) {
        button {
            font-size: 1.4em;
            padding: 18px 36px;
        }
    }

</style>
</head>
<body>

<div class="container">
  <h1>Arms And the Man</h1>

  <section id="pdf-section">
    <h2>Pdf Section</h2>
    <button onclick="openPdf()">Read the PDF</button>
  </section>

  <section id="video-section">
    <h2>Video Section</h2>
    <div id="video-container"></div>
  </section>
</div>

<script>
    function openPdf() {
        window.open("http://182.160.97.198:8080/xmlui/bitstream/handle/123456789/102/Arms%20and%20the%20Man-%20%20George%20Bernard%20Shaw.pdf", "_blank");
    }

    const videoLinks = [
        "https://youtu.be/Nn8tj0XGsMg?si=ZcL60i3HSldY6Nkx",
        "https://youtu.be/HRiH5d7dtiw?si=j-fVFj2oP3BKTjH9",
        "https://youtube.com/playlist?list=PLzs_CEeiwWn_UxJ_oFOTQAmBxqZd6gkzf&si=HhDhl7csJPeMZO5a"
    ];

    const videoContainer = document.getElementById("video-container");

    videoLinks.forEach(link => {
        const button = document.createElement("button");
        button.textContent = "Watch video";
        button.onclick = function() {
            window.open(link, "_blank");
        };
        videoContainer.appendChild(button);
    });

    // Add website button
    const websiteButton = document.createElement("button");
    websiteButton.textContent = "Read Arms and the Man";
    websiteButton.onclick = function() {
        window.open("https://www.gutenberg.org/files/3618/3618-h/3618-h.htm", "_blank");
    };
    videoContainer.appendChild(websiteButton);
</script>
</body>
</html>
