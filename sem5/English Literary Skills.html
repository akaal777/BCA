<!DOCTYPE html>
<html>
<head>
<title>Arms and the Man</title>
<style>
    /* Futuristic Theme */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #000;
        color: #fff;
        margin: 0;
        padding: 0;
        line-height: 1.7;
        overflow-x: hidden; /* Prevent horizontal scrollbar */
    }

    .container {
        width: 90%; /* Adjust container width for better smartphone fit */
        margin: 20px auto; /* Reduce margin for smaller screens */
        background-color: #111;
        padding: 30px;
        box-shadow: 0 0 30px rgba(0, 150, 255, 0.3);
        border-radius: 15px;
        border: 1px solid #222;
    }

    h1 {
        text-align: center;
        color: #0096ff;
        margin-bottom: 30px; /* Reduce margin for smaller screens */
        text-shadow: 0 0 10px #0096ff;
        font-size: 2.2em; /* Adjust font size for smaller screens */
        letter-spacing: 1.1px;
    }

    section {
        margin-bottom: 30px; /* Reduce margin for smaller screens */
        padding: 25px; /* Reduce padding for smaller screens */
        border: 1px solid #333;
        border-radius: 12px;
        background-color: #222;
        transition: all 0.4s ease;
        box-shadow: 0 0 15px rgba(0, 150, 255, 0.1);
    }

    section:hover {
        box-shadow: 0 0 20px rgba(0, 150, 255, 0.5);
        transform: translateY(-5px);
    }

    section h2 {
        margin-top: 0;
        color: #0096ff;
        border-bottom: 2px solid #0096ff;
        padding-bottom: 10px;
        font-size: 1.6em; /* Adjust font size for smaller screens */
        text-shadow: 0 0 5px #0096ff;
    }

    button {
        background-color: #0096ff;
        color: #fff;
        padding: 14px 28px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.4s ease;
        box-shadow: 0 2px 10px rgba(0, 150, 255, 0.4);
        font-size: 1.1em;
        letter-spacing: 1px;
        outline: none;
        margin: 5px;
    }

    button:hover {
        background-color: #0056b3;
        transform: translateY(-3px);
        box-shadow: 0 4px 12px rgba(0, 150, 255, 0.6);
    }

    #video-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px; /* Adjust gap for smaller screens */
    }

    iframe {
        margin: 10px; /* Adjust margin for smaller screens */
        border: none;
        box-shadow: 0 0 20px rgba(0, 150, 255, 0.3);
        border-radius: 12px;
        width: 100%; /* Make iframes responsive */
        height: 250px; /* Adjust height for smaller screens */
        max-width: 100%;
        transition: all 0.4s ease;
    }

    iframe:hover {
        box-shadow: 0 0 30px rgba(0, 150, 255, 0.5);
        transform: scale(1.05);
    }

    /* Responsive Design */
    @media (max-width: 768px) {
        .container {
            width: 95%;
            padding: 20px;
        }

        h1 {
            font-size: 2em;
        }

        section {
            padding: 15px;
        }

        iframe {
            height: 200px;
        }

        button {
            font-size: 1.2em;
            padding: 12px 24px;
        }
    }

    @media (max-width: 576px) {
        .container {
            width: 98%;
            margin: 10px auto;
            padding: 15px;
        }

        h1 {
            font-size: 1.8em;
        }

        section {
            padding: 10px;
        }

        button {
            font-size: 1.3em;
            padding: 10px 20px;
        }

        #video-container {
            gap: 10px;
        }

        iframe {
            height: 150px;
        }
    }

    /* Targeting specific screen size */
    @media (width: 400px) and (height: 900px) {
        button {
            font-size: 1.4em; /* Adjust font size */
            padding: 18px 36px; /* Adjust padding */
        }
    }

    /* General styles for a professional look on smartphones */
    @media (max-width: 576px) {
        body {
            font-size: 16px; /* Base font size for better readability */
        }

        h1 {
            font-size: 2.0em;
            margin-bottom: 25px;
        }

        section h2 {
            font-size: 1.7em;
            padding-bottom: 8px;
        }

        button {
            font-size: 1.2em; /* Medium button size */
            padding: 14px 28px;
        }
    }
</style>
</head>
<body>

<div class="container">
  <h1>Arms and the Man</h1>

  <section id="pdf-section">
    <h2>PDF Section</h2>
    <button onclick="openPdf()">View PDF</button>
  </section>

  <section id="video-section">
    <h2>Video Section</h2>
    <div id="video-container"></div>
  </section>
</div>

<script>
    function openPdf() {
        window.open("http://182.160.97.198:8080/xmlui/bitstream/handle/123456789/102/Arms%20and%20the%20Man-%20%20George%20Bernard%20Shaw.pdf", "_blank");
    }

    const videoLinks = [
        "https://youtu.be/Nn8tj0XGsMg?si=ZcL60i3HSldY6Nkx",
        "https://youtu.be/HRiH5d7dtiw?si=j-fVFj2oP3BKTjH9",
        "https://youtube.com/playlist?list=PLzs_CEeiwWn_UxJ_oFOTQAmBxqZd6gkzf&si=HhDhl7csJPeMZO5a"
    ];

    const videoContainer = document.getElementById("video-container");

    videoLinks.forEach(link => {
        const button = document.createElement("button");
        button.textContent = "Watch Video";
        button.onclick = function() {
            window.open(link, "_blank");
        };
        videoContainer.appendChild(button);
    });

    // Add website button
    const websiteButton = document.createElement("button");
    websiteButton.textContent = "Read on Arms and man";
    websiteButton.onclick = function() {
        window.open("https://www.gutenberg.org/files/3618/3618-h/3618-h.htm", "_blank");
    };
    videoContainer.appendChild(websiteButton);
</script>
</body>
</html>
