<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arms And the Man | A Modern Study Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* --- Modern Classy Theme --- */
            --bg-color: #1a1a1a;
            --card-color: #2b2b2b;
            --accent-gold: #c5a47e;
            --text-primary: #f5f5f5;
            --text-secondary: #a0a0a0;
            --border-color: rgba(197, 164, 126, 0.2);
            --font-primary: 'Poppins', sans-serif;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-primary);
            background-color: var(--bg-color);
            background-image: url('https://www.transparenttextures.com/patterns/subtle-carbon.png');
            color: var(--text-primary);
            line-height: 1.7;
            padding: 2rem;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.4s ease;
            margin-bottom: 3rem;
        }
        .back-button:hover {
            transform: translateY(-3px);
            color: var(--bg-color);
            background-color: var(--accent-gold);
            border-color: var(--accent-gold);
            box-shadow: 0 10px 25px rgba(197, 164, 126, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 5rem;
            opacity: 0;
            animation: fadeInDown 1s 0.2s ease-out forwards;
        }

        .main-heading {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -1px;
        }
        .main-heading span {
            color: var(--accent-gold);
        }

        /* --- Section Styling with Scroll Animation --- */
        .content-section {
            margin-bottom: 3.5rem;
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: clamp(2rem, 5vw, 3rem);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            /* Initial state for animation */
            opacity: 0;
            transform: translateY(50px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        .content-section.is-visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .section-heading {
            font-size: clamp(2rem, 4vw, 2.5rem);
            font-weight: 700;
            margin-bottom: 2.5rem;
            padding-bottom: 1rem;
            position: relative;
            color: var(--text-primary);
        }
        .section-heading::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60px;
            height: 3px;
            border-radius: 2px;
            background: var(--accent-gold);
        }

        .links-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
        }
        
        .resource-link {
            background-color: transparent;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 1rem;
            padding: 12px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s ease;
            font-family: var(--font-primary);
        }

        .resource-link:hover {
            background-color: var(--accent-gold);
            border-color: var(--accent-gold);
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(197, 164, 126, 0.2);
        }

        .resource-link.primary {
            background-color: var(--accent-gold);
            border-color: var(--accent-gold);
            color: #fff;
        }
        .resource-link.primary:hover {
            background-color: transparent;
            color: var(--text-secondary);
        }


        /* --- Animations --- */
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        
        /* --- Responsive Design --- */
        @media (max-width: 768px) { body { padding: 1.5rem; } }
        @media (max-width: 480px) { body { padding: 1rem; } .links-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <a href="../English Literary Skills.html" class="back-button"><span>&larr;</span> Back to English Skills</a>

        <header class="header">
            <h1 class="main-heading">Arms And the <span>Man</span></h1>
        </header>

        <section class="content-section">
            <h2 class="section-heading">Reading Materials</h2>
            <div class="links-container" id="reading-links"></div>
        </section>

        <section class="content-section">
            <h2 class="section-heading">Video Guides</h2>
            <div class="links-container" id="video-links"></div>
        </section>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const readingLinks = [
                { text: "Read the PDF", url: "http://182.160.97.198:8080/xmlui/bitstream/handle/123456789/102/Arms%20and%20the%20Man-%20%20George%20Bernard%20Shaw.pdf", type: 'primary' },
                { text: "Read on Gutenberg", url: "https://www.gutenberg.org/files/3618/3618-h/3618-h.htm", type: 'secondary' }
            ];

            const videoLinks = [
                { text: "Watch Full Play", url: "https://youtu.be/Nn8tj0XGsMg?si=ZcL60i3HSldY6Nkx", type: 'secondary' },
                { text: "Summary & Analysis", url: "https://youtu.be/HRiH5d7dtiw?si=j-fVFj2oP3BKTjH9", type: 'secondary' },
                { text: "In-Depth Playlist", url: "https://youtube.com/playlist?list=PLzs_CEeiwWn_UxJ_oFOTQAmBxqZd6gkzf&si=HhDhl7csJPeMZO5a", type: 'secondary' }
            ];

            function populateLinks(containerId, links) {
                const container = document.getElementById(containerId);
                if (!container) return;
                
                links.forEach(link => {
                    const button = document.createElement("button");
                    button.textContent = link.text;
                    button.className = 'resource-link';
                    if (link.type === 'primary') {
                        button.classList.add('primary');
                    }
                    button.onclick = () => window.open(link.url, "_blank");
                    container.appendChild(button);
                });
            }

            populateLinks("reading-links", readingLinks);
            populateLinks("video-links", videoLinks);

            // --- Scroll Animation Logic ---
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        observer.unobserve(entry.target); // Animate only once
                    }
                });
            }, {
                threshold: 0.1 // Trigger when 10% of the element is visible
            });

            document.querySelectorAll('.content-section').forEach(section => {
                observer.observe(section);
            });
        });
    </script>
</body>
</html>
